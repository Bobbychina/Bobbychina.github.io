出漂泊孤寂之感。","emotion":"诗人奉命出使边塞，途中见大漠落日之景，既赞叹边地风光的雄浑壮丽，又借征蓬、归雁自比，写出孤身远行的飘零之感，并暗含对边事与自身际遇的感慨。","technique":"以征蓬、归雁自比寄托身世，白描勾勒大漠孤烟与长河落日，讲究线条、色彩与动静对照，画面开阔而气象雄浑。","categories":["vast"],"imagery":["征蓬","归雁","大漠","孤烟","长河","落日","萧关","燕然"],"sourceSearch":"使至塞上 王维"},{"id":"song-you-ren","title":"送友人","author":"李白","dynasty":"唐","lines":["青山横北郭，白水绕东城。","此地一为别，孤蓬万里征。","浮云游子意，落日故人情。","挥手自兹去，萧萧班马鸣。"],"translation":"青山横卧在城北，白水环绕着城东。在这里我们一旦分别，你就像孤蓬一样踏上万里远行。浮云飘忽不定，正如游子漂泊的心意；落日缓缓西沉，恰似故人依依惜别的情谊。挥手之间你从此离去，连离群的马也萧萧长鸣。","scene":"青山横亘城北，白水环绕城东。友人将如孤蓬远行，浮云与落日映照游子和故人的心情；挥手作别时，离群的马也萧萧长鸣。","tone":"明朗开阔之中见缠绵不舍，情意深长而不流于衰飒悲苦。","emotion":"写送别友人时的依依惜别之情，以孤蓬、浮云写游子的漂泊，以落日表现故人的留恋，抒发深挚友情与离别惆怅。","technique":"以青山白水起笔对举，借孤蓬、浮云、落日比拟游子与故人，末以班马长鸣烘托离情，情景交融，语浅情深。","categories":["sad"],"imagery":["青山","白水","孤蓬","浮云","落日","班马"],"sourceSearch":"送友人 李白"},{"id":"tian-jing-sha-qiu-si","title":"天净沙·秋思","author":"马致远","dynasty":"元","lines":["枯藤老树昏鸦，小桥流水人家，古道西风瘦马。","夕阳西下，断肠人在天涯。"],"translation":"枯藤、老树和黄昏中的乌鸦，小桥、流水和人家，古道、西风和瘦马。夕阳向西沉落，漂泊天涯的人愁肠寸断。","scene":"枯藤、老树、昏鸦构成萧瑟的秋景，小桥流水人家显得安宁。古道、西风、瘦马与西下的夕阳，衬出天涯游子的孤独。","tone":"萧瑟凄凉，苍茫沉郁，层层铺景之后以断肠收束，悲慨逼人。","emotion":"写天涯游子在秋日黄昏的漂泊之苦。小桥流水人家与孤身远行形成对照，表现羁旅的孤独和思乡之愁。","technique":"前三句将九种景物并置，用简练的白描构成画面；以人家的安宁反衬游子的孤单，最后点出断肠之情。","categories":["sad"],"imagery":["枯藤","老树","昏鸦","小桥","流水","人家","古道","西风","瘦马","夕阳"],"sourceSearch":"天净沙·秋思 马致远"},{"id":"deng-le-you-yuan","title":"登乐游原","author":"李商隐","dynasty":"唐","lines":["向晚意不适，驱车登古原。","夕阳无限好，只是近黄昏。"],"translation":"傍晚时分心情不畅，便驱车登上古老的乐游原。夕阳的余晖无限美好，只可惜已经临近黄昏，好景就要逝去了。","scene":"诗人因心情不畅而驱车登上古原，看见无限美好的夕阳，也意识到黄昏将近。画面明丽，感受中带着好景难留的惋惜。","tone":"明丽中含苍凉，惋惜低回，一唱三叹而寄慨遥深。","emotion":"按常见的转折读法，诗人赞叹夕阳之美，又为黄昏将近而惋惜，寄托对美好事物难以久留的感触。诗中没有直接交代心情不畅的原因。","technique":"前两句叙事点明缘由，后两句即景抒情，以无限好与近黄昏对照转折，理趣与情思相融，短章而含不尽之意。","categories":["sad"],"imagery":["古原","夕阳","黄昏"],"sourceSearch":"登乐游原 李商隐","note":"“只是”的理解历来有分歧；此处采用常见的转折读法。对国运、年龄等进一步联想属于解释，不作为诗中已明说的事实。"},{"id":"shan-ju-qiu-ming","title":"山居秋暝","author":"王维","dynasty":"唐","lines":["空山新雨后，天气晚来秋。","明月松间照，清泉石上流。","竹喧归浣女，莲动下渔舟。","随意春芳歇，王孙自可留。"],"translation":"空旷的山中刚下过一场新雨，傍晚的天气更显出秋的凉意。明月从松林间洒下清辉，清泉在山石上淙淙流淌。竹林里传来喧笑，那是洗衣的姑娘归来；荷叶摇动，是渔舟顺流而下。任凭春天的芳菲消歇，我这样的人自可留在山中。","scene":"新雨后的空山带着秋夜凉意，明月照松，清泉流石。竹林里的声响传出浣女归来的消息，莲叶摇动处有渔舟顺流而下，清幽中又见生活气息。","tone":"清新淡远，宁静之中时见活泼生机，读之令人神清气爽。","emotion":"描写秋日山居的清幽景色与日常生活，表现对自然和山居生活的喜爱。“王孙自可留”回应归隐主题，体现愿意留居山中的心意。","technique":"以空山、明月、清泉、竹莲构成清幽画面，动静结合、视听相衬，末联用典表明归隐之志，景中有人。","categories":["calm"],"imagery":["空山","新雨","明月","松","清泉","石","竹","莲","渔舟"],"sourceSearch":"山居秋暝 王维"},{"id":"niao-ming-jian","title":"鸟鸣涧","author":"王维","dynasty":"唐","lines":["人闲桂花落，夜静春山空。","月出惊山鸟，时鸣春涧中。"],"translation":"人心安闲，桂花悄然飘落；夜深人静，春天的山野一片空寂。月亮升起，惊动了山中栖息的鸟，它们不时在春天的涧谷里鸣叫。","scene":"春夜山涧幽静，闲适的人感知到桂花飘落。月亮升起惊动山鸟，不时传来的鸟鸣更显山中的空寂。","tone":"幽静清空，闲淡澄澈，静中微有生趣。","emotion":"写春夜山涧的空静与生机，表现诗人闲适恬淡的心境和与自然相融的幽微喜悦，透出澄澈自适的禅意。","technique":"以桂花落、月出、鸟鸣等细微动态反衬静境，以动写静、以声衬寂，白描中含禅意，语淡而境幽。","categories":["calm"],"imagery":["桂花","春山","月","山鸟","春涧"],"sourceSearch":"鸟鸣涧 王维"},{"id":"zhu-li-guan","title":"竹里馆","author":"王维","dynasty":"唐","lines":["独坐幽篁里，弹琴复长啸。","深林人不知，明月来相照。"],"translation":"独自坐在幽深的竹林里，一边弹琴一边放声长啸。深林中没有人知道我在这里，只有明月升起来照耀着我。","scene":"诗人独坐幽深竹林，弹琴长啸。深林中无人知晓，明月却来相照，清幽的环境中有独处的自在。","tone":"清幽孤清，闲淡自适，静而不冷。","emotion":"写月夜竹林中独处的情境，表现远离喧嚣、悠然自得的心境。人与明月相伴，使独处显得宁静而有情趣。","technique":"以幽篁、深林、明月营造清幽之境，以弹琴长啸衬托环境的静，并将明月人格化，写出人与自然相伴的情趣。","categories":["calm"],"imagery":["幽篁","深林","明月","琴"],"sourceSearch":"竹里馆 王维"},{"id":"lu-zhai","title":"鹿柴","author":"王维","dynasty":"唐","lines":["空山不见人，但闻人语响。","返景入深林，复照青苔上。"],"translation":"空旷的山中看不见人影，只听见有人说话的声音。夕阳的余晖返照进幽深的树林，又落在青苔上。","scene":"空山深林，不见人影只闻人语，落日返照斜射入林，落在青苔之上，光影幽微，愈显山谷空寂清冷，静得可以听见声响。","tone":"空寂幽清，静中微暖，余味淡远。","emotion":"写空山深林的寂静与夕照微光，表现诗人对幽静自然的细致体味和超然闲淡的心境，隐含独处而不觉孤苦的自适。","technique":"以不见人与闻人语、声与静相对照，借返景、青苔的细微光影渲染空寂，以动衬静，不言情而情自远。","categories":["calm"],"imagery":["空山","返景","深林","青苔"],"sourceSearch":"鹿柴 王维"},{"id":"guo-gu-ren-zhuang","title":"过故人庄","author":"孟浩然","dynasty":"唐","lines":["故人具鸡黍，邀我至田家。","绿树村边合，青山郭外斜。","开轩面场圃，把酒话桑麻。","待到重阳日，还来就菊花。"],"translation":"老朋友备好了饭菜，邀请我到他的农家做客。绿树环绕着村庄，青山在城郭外斜斜横卧。推开窗子面对谷场和菜园，端起酒杯谈起农事桑麻。等到重阳节那天，我还要再来赏菊饮酒。","scene":"绿树环村、青山斜郭的田家，窗对场圃，把酒闲话桑麻，朴素宁静的乡村生活里透出亲切温暖的情味，宾主相得。","tone":"平淡自然，淳朴亲切，语淡而情浓。","emotion":"写应邀到农家做客的情景，表现故人之间的真挚情谊与田园生活的亲切恬淡。相约重阳再来，流露对这次相聚的留恋。","technique":"以家常语叙家常事，绿树青山、场圃桑麻白描成画，末联预约重阳赏菊，语淡而情长，结构自然流转。","categories":["calm"],"imagery":["绿树","青山","场圃","桑麻","菊花","田家"],"sourceSearch":"过故人庄 孟浩然"},{"id":"yin-jiu-qi-wu","title":"饮酒·其五","author":"陶渊明","dynasty":"东晋","lines":["结庐在人境，而无车马喧。","问君何能尔？心远地自偏。","采菊东篱下，悠然见南山。","山气日夕佳，飞鸟相与还。","此中有真意，欲辨已忘言。"],"translation":"把居所建在人们聚居的地方，却没有车马往来的喧闹。问我怎能如此？心灵远离尘俗，所处之地自然也觉得幽静。在东篱下采摘菊花，悠然间看见南山。傍晚山间的云气十分美好，飞鸟结伴归还。这其中有生活的真正意趣，想要辨明，却难以用言语表达。","scene":"居于人境而心无喧扰，东篱采菊时悠然见到南山。傍晚山气美好，飞鸟结伴归还，平淡的田园景象与自得的心境相融。","tone":"冲淡自然，悠然自得，静穆而有真趣。","emotion":"写远离尘俗、心远自偏的田园生活，表现诗人安贫乐道、与自然相契合的恬淡心境，以及对人生真意的会心体悟。","technique":"以设问自答点明心远，采菊见山、山气飞鸟白描成境，融情入景，末以忘言收束，含蓄有理趣，不假雕饰。","categories":["calm"],"imagery":["菊","东篱","南山","山气","飞鸟","车马"],"sourceSearch":"饮酒·其五 陶渊明","sourceVerified":true,"sourceUrl":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/recommended-passages/KS4_11.pdf"},{"id":"jiang-xue","title":"江雪","author":"柳宗元","dynasty":"唐","lines":["千山鸟飞绝，万径人踪灭。","孤舟蓑笠翁，独钓寒江雪。"],"translation":"群山中不见飞鸟，许多山路上不见人的踪迹。只有一叶孤舟上，一位身披蓑衣、头戴斗笠的老翁，独自在下雪的寒江上垂钓。","scene":"群山无鸟，山路无人，孤舟上的老翁独钓寒江。广阔而寂静的雪景与孤独的垂钓者形成鲜明对照。","tone":"清冷孤绝，严静峭拔，冷中有骨。","emotion":"诗中独钓者置身清冷空寂的天地，显得孤独而自持。常见解读将这一形象与诗人贬谪后的处境联系起来，读出不随流俗的坚守。","technique":"以千山、万径的广与孤舟、独钓的少相对照，白描极静之境，托物言志，冷景中见人格，收束有力。","categories":["sad","noble"],"imagery":["千山","鸟","万径","孤舟","蓑笠","寒江","雪"],"sourceSearch":"江雪 柳宗元"},{"id":"feng-xue-su-fu-rong-shan-zhu-ren","title":"逢雪宿芙蓉山主人","author":"刘长卿","dynasty":"唐","lines":["日暮苍山远，天寒白屋贫。","柴门闻犬吠，风雪夜归人。"],"translation":"日暮时远山显得苍茫，天寒中茅屋显得贫寒。柴门处传来犬吠声，有人在风雪之夜归来。","scene":"日暮远山苍茫，寒天中的茅屋简陋。柴门犬吠与风雪夜归人的出现，使冷寂的山村画面有了人的活动。","tone":"清寒苍茫，冷寂中见温厚，语简而境远。","emotion":"写风雪之夜山居投宿的见闻，呈现行旅的寒苦与贫寒山家的生活。末句引入夜归人，让清寒的景象带上人间生活的气息。","technique":"由远及近、由景及声，苍山白屋层层渲染寒意，末以犬吠与风雪夜归人点活画面，以声衬静，含蓄不尽。","categories":["sad"],"imagery":["苍山","白屋","柴门","犬吠","风雪"],"sourceSearch":"逢雪宿芙蓉山主人 刘长卿","note":"“夜归人”所指有不同解读，译文保留其开放性，不据此补写叩门等动作。"},{"id":"mei-hua","title":"梅花","author":"王安石","dynasty":"宋","lines":["墙角数枝梅，凌寒独自开。","遥知不是雪，为有暗香来。"],"translation":"墙角有几枝梅花，冒着严寒独自开放。远远就知道那不是雪，因为有幽微的香气飘来。","scene":"墙角几枝梅花迎着严寒开放，远看似雪，幽微的香气却表明是花。清冷的画面突出了梅花不畏严寒的生命力。","tone":"清峭淡雅，孤高自持，含蓄而有风骨。","emotion":"赞赏梅花凌寒独开、暗香清幽的品格。以梅喻人的读法，可从中体会不随流俗、坚守自身品格的精神。","technique":"以梅喻人，托物言志；以不是雪与暗香来从视觉、嗅觉辨形写神，虚实相生，含蓄有致。","categories":["noble"],"imagery":["墙角","梅","雪","暗香"],"sourceSearch":"梅花 王安石"},{"id":"mo-mei","title":"墨梅","author":"王冕","dynasty":"元","lines":["吾家洗砚池头树，个个花开淡墨痕。","不要人夸好颜色，只留清气满乾坤。"],"translation":"我家洗砚池边的那株梅树，朵朵花开都带着淡淡的墨痕。它不需要别人夸赞颜色好看，只愿留下清香之气充满天地之间。","scene":"画中的梅树与洗砚池相联系，花朵带着淡淡墨痕；诗人不看重鲜艳的颜色，而强调清气充满天地，呈现素淡高洁的意味。","tone":"清淡高洁，孤傲自守，语直而气盛。","emotion":"借墨梅自喻，表达不慕虚荣、不求人夸的品格，抒发诗人坚守清高、愿以清气立身的人格追求与自信。","technique":"托物言志，以淡墨痕与好颜色对比，末句直抒胸臆，物我合一，语言朴素而骨力自见。","categories":["noble"],"imagery":["洗砚池","墨痕","颜色","清气","乾坤"],"sourceSearch":"墨梅 王冕","note":"首句有“吾家”与“我家”的异文；此处保留“吾家”。故宫相关文献引文作“吾家……个个”，所链接的香港教育局选编作“我家……个个”，不要把版本差异误判为错字。","sourceUrl":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/primary/lang/jilei_shi_pdf/jilei_shi_094.pdf","sourceVerified":true},{"id":"zhu-shi","title":"竹石","author":"郑燮","dynasty":"清","lines":["咬定青山不放松，立根原在破岩中。","千磨万击还坚劲，任尔东西南北风。"],"translation":"竹子紧紧咬住青山毫不放松，根须本来就扎在破裂的岩石之中。经历千万次折磨打击仍然坚韧挺拔，任凭你东西南北四面来风。","scene":"竹子扎根破岩，牢牢依附青山，经历磨击仍然坚劲，任凭四面来风。诗人突出了它经受考验而不动摇的姿态。","tone":"刚劲峭拔，坚韧豪迈，斩截有力。","emotion":"借竹写人，赞颂不畏磨难、坚守气节的精神，表达诗人刚正不阿、坚贞不屈的人生态度与凛然自信。","technique":"以咬定二字拟人写竹根深入，托物言志，以千磨万击与任尔对照，语言斩截，气势逼人。","categories":["noble"],"imagery":["青山","破岩","风"],"sourceSearch":"竹石 郑燮"},{"id":"shi-hui-yin","title":"石灰吟","author":"于谦","dynasty":"明","lines":["千锤万凿出深山，烈火焚烧若等闲。","粉骨碎身浑不怕，要留清白在人间。"],"translation":"石灰石经过千锤万凿才从深山中开采出来，烈火焚烧对它来说也如同平常。即使粉身碎骨也全然不怕，只要能把清白留在人世间。","scene":"石灰石从深山中开凿出来，经烈火焚烧，即使粉骨碎身仍要留下清白。诗人将这些过程赋予人的意志，形象刚烈而纯净。","tone":"刚烈坚贞，豪迈磊落，正气凛然。","emotion":"借石灰自况，表达不惧磨难与牺牲、坚持清白节操的志向，体现刚正坚定的品格追求。","technique":"托物言志，以石灰的开采、煅烧、粉碎过程比拟人格历练，层层推进，末句双关清白，明志有力。","categories":["noble"],"imagery":["深山","烈火"],"sourceSearch":"石灰吟 于谦","sourceUrl":"https://lcsjyy.lcedu.cn/studio/index.php?id=117887&isShowShareBtn=true&r=studiowechat/album/view&sid=300477","note":"此处采用“千锤万凿”“粉骨碎身浑不怕”。流传版本另见“千锤万击”“粉身碎骨全不怕”等写法，核对背诵时应以本班教材为准。","sourceVerified":true},{"id":"zeng-liu-jing-wen","title":"赠刘景文","author":"苏轼","dynasty":"宋","lines":["荷尽已无擎雨盖，菊残犹有傲霜枝。","一年好景君须记，正是橙黄橘绿时。"],"translation":"荷花凋尽，连那擎雨的荷叶也已经没有了；菊花残败，却还留着傲霜的枝条。一年中最好的景致你要记住，正是橙子金黄、橘子青绿的时节。","scene":"荷叶已败，菊花虽残却仍有傲霜的枝条；橙黄橘绿又为岁末景象添上鲜明色彩。诗人在衰残与丰美的对照中发现好景。","tone":"明快旷达，衰中见壮，于秋末冷景中透出勉励之意。","emotion":"以岁末景物赠友，赞赏菊枝傲霜的精神，又提醒友人记住橙黄橘绿的好时节，传达珍惜光景、保持乐观的勉励。","technique":"前两句以荷尽、菊残对举写秋末衰景，后两句转出橙黄橘绿，欲扬先抑，托物寄意，勉励之中含理趣。","categories":["noble"],"imagery":["荷","菊","霜","橙","橘"],"sourceSearch":"赠刘景文 苏轼","note":"末句通行本作正是橙黄橘绿时，亦有一作最是，属版本异文。"},{"id":"chan","title":"蝉","author":"虞世南","dynasty":"唐","lines":["垂緌饮清露，流响出疏桐。","居高声自远，非是藉秋风。"],"translation":"蝉垂下像帽缨一样的触须，饮着清亮的露水；连续不断的鸣叫声从稀疏的梧桐树间传出。它身居高处，声音自然传得远，并不是凭借秋风的力量。","scene":"诗写蝉垂緌饮露，清亮的鸣声从疏桐传出。居于高处，声音自能传远，画面与声音共同营造清雅高洁的意味。","tone":"清雅高远，含蓄自许，语淡而志显。","emotion":"借蝉饮露高鸣自比，表明立身高洁、声名自远不假外力的自信，寄托诗人对清峻品格与独立人格的追求。","technique":"托物言志，以蝉的形、声、境层层描写，居高声自远一联议论点旨，比兴含蓄，寓意深远。","categories":["noble"],"imagery":["垂緌","清露","疏桐","秋风"],"sourceSearch":"蝉 虞世南","note":"“藉”意为凭借；此处保留“藉秋风”的用字。"},{"id":"deng-guan-que-lou","title":"登鹳雀楼","author":"王之涣","dynasty":"唐","lines":["白日依山尽，黄河入海流。","欲穷千里目，更上一层楼。"],"translation":"太阳依着群山缓缓落下，黄河奔腾着流向大海。要想把千里之外的景色尽收眼底，就要再登上一层高楼。","scene":"白日西沉依山而尽，黄河滚滚奔流入海，天地开阔雄浑，登楼远望，视野与胸襟一同向高处拓展，气势壮阔。","tone":"雄浑开阔，昂扬向上，理趣与豪情兼备。","emotion":"写登楼所见的壮阔山河，抒发诗人开阔的胸襟与不断进取、追求更高境界的志向，也寓含积极向上的人生哲理。","technique":"前两句以依山尽、入海流写景，气势雄浑；后两句即景说理，以更上一层楼寓进取之意，景理相融，浑然天成。","categories":["vast"],"imagery":["白日","山","黄河","海","楼"],"sourceSearch":"登鹳雀楼 王之涣"},{"id":"liang-zhou-ci-huang-he-yuan-shang","title":"凉州词·黄河远上","author":"王之涣","dynasty":"唐","lines":["黄河远上白云间，一片孤城万仞山。","羌笛何须怨杨柳，春风不度玉门关。"],"translation":"黄河远远地伸向白云之间，一座孤城矗立在万仞高山之中。羌笛何必吹奏哀怨的《折杨柳》呢，春风本来就吹不到玉门关外啊。","scene":"黄河远上白云，孤城独立万仞山中，边地空旷荒寒，羌笛声里杨柳哀怨，玉门关外春风不到，苍茫中透出戍边之苦。","tone":"雄浑苍凉，悲壮中含怨思，含蓄不尽。","emotion":"雄浑荒寒的边塞景象与羌笛中的离别曲相结合，表现戍边者的思乡愁怨。“何须怨”看似宽慰，反而使难以排遣的乡愁更深。","technique":"起句以黄河、白云、孤城、高山构成雄浑画面，后转为羌笛怨柳的抒情，语带双关，含蓄悲凉，境界阔大。","categories":["vast","sad"],"imagery":["黄河","白云","孤城","万仞山","羌笛","杨柳","玉门关","春风"],"sourceSearch":"凉州词 王之涣","note":"此首一题作出塞，属版本异文。"},{"id":"chu-sai-qi-yi","title":"出塞·其一","author":"王昌龄","dynasty":"唐","lines":["秦时明月汉时关，万里长征人未还。","但使龙城飞将在，不教胡马度阴山。"],"translation":"还是秦汉以来的明月和边关，远征万里的将士却没有归来。如果有英勇善战的良将镇守边关，就不会让敌人的骑兵越过阴山。","scene":"明月照临秦汉旧关，边塞苍茫辽阔，万里征人未归，怀想飞将军镇边，雄浑悲慨之中透出历史的厚重与苍凉。","tone":"雄浑悲壮，苍凉深沉，寄慨遥深。","emotion":"写边关久战、征人不归的悲慨，表达希望良将守边、平息边患的愿望，也含对士卒的同情与对国事的忧虑。","technique":"以秦时明月汉时关互文起笔，时空跨越，后两句借飞将军典故议论言志，怀古与伤今交织，格调高远。","categories":["vast"],"imagery":["明月","关","龙城","飞将","胡马","阴山"],"sourceSearch":"出塞 王昌龄","note":"“龙城飞将”的具体所指有不同解释。这里侧重理解为有威望、能守边的良将，不把某一种考证写成定论。"},{"id":"cong-jun-xing-qi-si","title":"从军行·其四","author":"王昌龄","dynasty":"唐","lines":["青海长云暗雪山，孤城遥望玉门关。","黄沙百战穿金甲，不破楼兰终不还。"],"translation":"青海湖上长云弥漫，遮暗了雪山；孤城遥遥相望着玉门关。在黄沙中身经百战，磨穿了身上的铠甲；不攻破楼兰，绝不回还。","scene":"青海长云压暗雪山，孤城遥对玉门关，黄沙漫漫、金甲磨穿，边塞雄浑肃杀之中挺立着将士决绝而不退的身影。","tone":"雄浑悲壮，慷慨激昂，气骨凛然。","emotion":"写戍边将士艰苦卓绝的战斗生活，歌颂他们不畏艰险、誓死杀敌报国的壮志与决心，也见其坚韧与豪迈。","technique":"前两句以长云、雪山、孤城、玉门关布景，境界阔大；后两句直抒胸臆，以穿金甲与终不还对照见志，笔力遒劲。","categories":["vast"],"imagery":["青海","长云","雪山","孤城","玉门关","黄沙","金甲","楼兰"],"sourceSearch":"从军行 王昌龄"},{"id":"deng-you-zhou-tai-ge","title":"登幽州台歌","author":"陈子昂","dynasty":"唐","lines":["前不见古人，后不见来者。","念天地之悠悠，独怆然而涕下。"],"translation":"往前看不到古代礼贤下士的君王，往后也看不到后世求才的明主。想到天地是这样的辽阔悠远，我独自悲伤，不禁泪流满面。","scene":"诗人由古人与来者想到天地的悠远，在辽阔的时间和空间中感到独自一人的悲怆，不禁流泪。","tone":"苍凉悲慨，沉郁雄浑，声情激越。","emotion":"抒发诗人怀才不遇、报国无门的深沉悲愤，也含对明君难遇、知音难求的孤独感与对天地无穷的浩叹。","technique":"以前后的时空对举和天地悠悠的广阔背景，反衬独字，直抒胸臆，不假雕饰而气象磅礴。","categories":["vast","sad"],"imagery":["天地"],"sourceSearch":"登幽州台歌 陈子昂"},{"id":"wang-yue","title":"望岳","author":"杜甫","dynasty":"唐","lines":["岱宗夫如何？齐鲁青未了。","造化钟神秀，阴阳割昏晓。","荡胸生曾云，决眦入归鸟。","会当凌绝顶，一览众山小。"],"translation":"泰山究竟怎样呢？齐鲁大地上，青翠的山色连绵不尽。大自然把神奇秀美汇聚在这里，山的向阳面与背阴面明暗分明，仿佛分出了清晨和黄昏。层层云气使我心胸激荡，我睁大眼睛追望归鸟。一定要登上最高峰，那时放眼望去，众山都会显得低小。","scene":"泰山的青翠连绵不尽，山势高大，使向阳面和背阴面显出鲜明的明暗差别。层云升起，归鸟入目，仰望雄伟山岳激发出登顶远眺的愿望。","tone":"雄浑壮阔，昂扬豪迈，气盛而志远。","emotion":"写望泰山的雄伟气象，抒发诗人对祖国山河的热爱和青年时期的豪情壮志，表现勇于攀登、俯瞰天下的抱负。","technique":"由远望、近望到细望层层推进，钟、割二字炼字奇警，末联设想登顶，以虚写实，气象宏阔，结句有力。","categories":["vast"],"imagery":["岱宗","齐鲁","曾云","归鸟","众山"],"sourceSearch":"望岳 杜甫","note":"正文据人教社公开朗读页所列版本录作“荡胸生曾云”；“曾”同“层”，表示重叠。其他版本亦作“层云”。"},{"id":"chun-wang","title":"春望","author":"杜甫","dynasty":"唐","lines":["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，家书抵万金。","白头搔更短，浑欲不胜簪。"],"translation":"国都已经破碎，山河依旧还在；春天的长安城，草木茂密丛生。感伤时局，看见花开也落泪；怅恨离别，听到鸟鸣也心惊。战火连绵已经三个月不断，一封家书抵得上万两黄金。满头白发越搔越短，简直要插不住发簪了。","scene":"国破后的长安春城草木深深，花鸟依旧而人事全非，烽火连绵、家书难通，荒败的春景里满是凄怆与离乱之痛，触目惊心。","tone":"沉郁悲怆，苍凉顿挫，字字含泪。","emotion":"写安史之乱中国家残破、家人离散的痛苦，抒发诗人忧国伤时、思家念亲的深沉悲哀与力不从心的衰老之叹。","technique":"以乐景写哀情，花鸟溅泪惊心；由远及近、由国及家层层推进，末以白头搔短的形象作结，笔力沉痛。","categories":["sad"],"imagery":["山河","城","草木","花","鸟","烽火","家书","白头","簪"],"sourceSearch":"春望 杜甫"},{"id":"bo-qin-huai","title":"泊秦淮","author":"杜牧","dynasty":"唐","lines":["烟笼寒水月笼沙，夜泊秦淮近酒家。","商女不知亡国恨，隔江犹唱后庭花。"],"translation":"烟雾笼罩着寒冷的河水，月光笼罩着岸边的沙地，夜里船停泊在秦淮河畔，靠近酒家。卖唱的歌女不懂得亡国的遗恨，隔着江水还在唱那《玉树后庭花》。","scene":"烟雾和月光笼罩着寒水沙岸，诗人夜泊秦淮，邻近酒家。隔江传来的《后庭花》歌声，让迷蒙的夜景与亡国的历史联想相连。","tone":"清冷幽怨，婉而含讽，寄慨深沉。","emotion":"诗人由《后庭花》想到亡国旧事，寄托忧国伤时之感。讽刺的锋芒不宜只理解为指责歌女，还指向沉迷享乐、缺乏忧患意识的听歌者。","technique":"以烟笼寒水月笼沙互文写景，营造迷蒙冷寂氛围；由景入事，借商女唱曲与亡国曲名婉讽，含蓄有力。","categories":["sad"],"imagery":["烟","寒水","月","沙","秦淮","酒家","商女","江","后庭花"],"sourceSearch":"泊秦淮 杜牧"},{"id":"feng-qiao-ye-bo","title":"枫桥夜泊","author":"张继","dynasty":"唐","lines":["月落乌啼霜满天，江枫渔火对愁眠。","姑苏城外寒山寺，夜半钟声到客船。"],"translation":"月亮落下，乌鸦啼叫，寒霜充满天地；江边枫树与渔船灯火相对，伴着我满怀愁绪难以入眠。姑苏城外的寒山寺，半夜敲响的钟声传到了客船上。","scene":"月落乌啼、霜气满天，江枫渔火明灭于夜色，寒山寺夜半钟声悠悠传来，冷寂幽深中透着旅人的不眠愁绪，声景相融。","tone":"清冷幽寂，愁思绵长，余韵悠远。","emotion":"写旅途中夜泊枫桥的见闻。“愁眠”点明旅人的愁绪，月落、乌啼、寒霜与夜半钟声共同烘托客居异乡的孤寂。","technique":"以月落、乌啼、霜天、江枫、渔火层层铺陈冷色夜景，末以夜半钟声以声衬静，余韵悠远，画面如绘。","categories":["sad"],"imagery":["月","乌啼","霜","江枫","渔火","寒山寺","钟声","客船"],"sourceSearch":"枫桥夜泊 张继"},{"id":"ye-yu-ji-bei","title":"夜雨寄北","author":"李商隐","dynasty":"唐","lines":["君问归期未有期，巴山夜雨涨秋池。","何当共剪西窗烛，却话巴山夜雨时。"],"translation":"你问我回家的日期，我还没有确定的归期；此刻巴山夜雨淅沥，秋日的池水已经涨满。什么时候我们才能同在西窗下剪着烛花，回头再谈起今夜巴山夜雨的情景呢。","scene":"巴山秋夜下着雨，池水上涨，归期仍未确定。诗人想象将来在西窗下相聚、回忆今夜，现实的孤寂与重逢的期待相互映照。","tone":"凄清缠绵，含蓄温婉，愁而不绝。","emotion":"写羁旅中归期难定的惆怅与对远方收信人的思念，并期待重逢后共同回忆今夜，情意回环深长。","technique":"首句回应对方询问，突出归期无定；以夜雨涨池烘托愁绪，再想象重逢后回忆今夜，两次“巴山夜雨”形成时间上的回环。","categories":["sad"],"imagery":["巴山","夜雨","秋池","西窗","烛"],"sourceSearch":"夜雨寄北 李商隐"},{"id":"jing-ye-si","title":"静夜思","author":"李白","dynasty":"唐","lines":["床前明月光，疑是地上霜。","举头望明月，低头思故乡。"],"translation":"床前洒满明亮的月光，让人疑心是地上铺了一层白霜。抬起头望着天上的明月，低下头便思念起故乡。","scene":"夜里月光明亮如霜，诗人抬头望月，又低头思念故乡。清冷的月色与简单的动作相连，自然引出乡思。","tone":"清冷平易，静中含愁，语浅意长。","emotion":"由月夜清光引发乡思，抒发客居异乡的孤寂与对故乡亲人的深切怀念，情思自然而动人。","technique":"以疑霜写月色之白，举头与低头两个动作对照，由景入情，语言平白如话而余味悠长。","categories":["sad"],"imagery":["明月","月光","霜","故乡"],"sourceSearch":"静夜思 李白","note":"此处采用今通行本。宋代李白集等早期传本多作“床前看月光”“举头望山月”；异文并非仅见于明刊本，也不是中日版本独有的差别。","sourceUrl":"https://www.gdwx.fudan.edu.cn/22/fe/c23469a205566/page.htm","sourceVerified":true},{"id":"yue-ye-yi-she-di","title":"月夜忆舍弟","author":"杜甫","dynasty":"唐","lines":["戍鼓断人行，边秋一雁声。","露从今夜白，月是故乡明。","有弟皆分散，无家问死生。","寄书长不达，况乃未休兵。"],"translation":"戍楼的更鼓断绝了行人往来，边地秋夜传来一声孤雁的哀鸣。露水从今夜起变白，月亮还是故乡的最明亮。兄弟们都已分散各处，没有家园可以打听他们的生死。寄去的书信常常不能送到，何况战乱还没有停止。","scene":"边秋戍鼓断绝人行，孤雁哀鸣，白露初降、月色清冷，战乱中音书难通，荒寒的秋夜里满是离散的忧思与牵挂。","tone":"沉郁悲凉，凄清哀婉，情深而痛。","emotion":"写战乱中兄弟离散、音信断绝的忧念，抒发诗人对亲人的深切思念和对战乱不息的悲慨，也含身世飘零之痛。","technique":"以戍鼓、雁声、白露、明月层层写景，月是故乡明移情于物；由景及事、由己及弟层层推进，情真语挚。","categories":["sad"],"imagery":["戍鼓","雁","露","月","故乡","兵"],"sourceSearch":"月夜忆舍弟 杜甫"},{"id":"jiu-yue-jiu-ri-yi-shan-dong-xiong-di","title":"九月九日忆山东兄弟","author":"王维","dynasty":"唐","lines":["独在异乡为异客，每逢佳节倍思亲。","遥知兄弟登高处，遍插茱萸少一人。"],"translation":"独自一人在他乡做客，每当遇到佳节就更加思念亲人。遥想兄弟们今日登高的地方，人人插着茱萸，却唯独少了我一个人。","scene":"重阳佳节，异乡独客倍思亲人，遥想兄弟们登高插茱萸的热闹，愈显自身孤身在外、缺席其中的落寞与怅然。","tone":"平易深挚，寂寞中含温情，语淡愁长。","emotion":"写重阳佳节独在异乡的思亲之情，从对方着笔写兄弟登高少一人，抒发深切的乡愁与真挚的手足之情。","technique":"前两句直抒倍思亲，后两句转从兄弟一方设想，以少一人侧面写己之孤独，构思婉曲，情味更浓。","categories":["sad"],"imagery":["异乡","佳节","兄弟","登高","茱萸"],"sourceSearch":"九月九日忆山东兄弟 王维"},{"id":"qiu-si","title":"秋思","author":"张籍","dynasty":"唐","lines":["洛阳城里见秋风，欲作家书意万重。","复恐匆匆说不尽，行人临发又开封。"],"translation":"洛阳城里秋风起，想写一封家信，心中却有万重思绪。又担心匆忙间没有把想说的话说完，捎信的人临出发时，我再次打开了信封。","scene":"洛阳秋风乍起，客中欲作家书，千言万语难以尽述，临发又开封的细节里满是游子的犹疑与牵挂，平常景象见深愁。","tone":"平实深婉，愁思缠绵，细节见情。","emotion":"写客居洛阳见秋风而起的思乡之情，通过修书、开封的细节，表现对家乡亲人的深切思念与难以尽言的牵挂。","technique":"选取作家书、又开封的生活细节，以小见大，心理描写细腻，平中见奇，不言愁而愁自见。","categories":["sad"],"imagery":["洛阳","秋风","家书","行人"],"sourceSearch":"秋思 张籍"},{"id":"extra-qiantanghuchunxing","title":"钱塘湖春行","author":"白居易","dynasty":"唐","lines":["孤山寺北贾亭西，水面初平云脚低。","几处早莺争暖树，谁家新燕啄春泥。","乱花渐欲迷人眼，浅草才能没马蹄。","最爱湖东行不足，绿杨阴里白沙堤。"],"translation":"从孤山寺北面走到贾亭西面，春水刚涨平湖岸，低垂的云仿佛贴着水面。几处早来的黄莺争着栖上向阳的树，不知谁家新来的燕子正在衔取春泥。缤纷的花渐渐让人目不暇接，初生的草刚能遮住马蹄。我最喜爱湖东的景色，总觉得游赏不够，尤其是绿杨掩映中的白沙堤。","scene":"春水初涨，低云映湖，视线沿着骑行的路线移向树间的早莺、新燕，再落到近处的花草。最后，绿杨遮映的白沙堤留住游人。疏密有致的景物共同呈现早春刚刚苏醒、处处生长的湖边世界。","tone":"明朗、轻快而富有生气，细微春色中流露流连忘返的愉悦。","emotion":"诗人敏锐地捕捉初春尚未繁盛的变化，早莺、新燕和浅草都使他欣喜。末联直接说出喜爱与游赏不尽之感。作品的中心是亲近自然、珍惜春光，不应因云低或树阴而解读成压抑、伤春。","technique":"以行踪串联景物，运用远近转换和动静结合；颔联对仗写鸟的动作，早、新、渐、才等字共同突出早春时令。","categories":["calm"],"imagery":["水","云","早莺","暖树","新燕","春泥","乱花","浅草","绿杨","白沙堤"],"sourceSearch":"钱塘湖春行 白居易","sourceUrl":"https://zh.wikisource.org/zh/錢塘湖春行","sourceVerified":true,"note":"分类取其自然清新的一面；全诗比典型的冲淡闲远更明快活泼。"},{"id":"extra-chunyexiyu","title":"春夜喜雨","author":"杜甫","dynasty":"唐","lines":["好雨知时节，当春乃发生。","随风潜入夜，润物细无声。","野径云俱黑，江船火独明。","晓看红湿处，花重锦官城。"],"translation":"这场好雨仿佛懂得时节，在春天万物生长时来到。它随着风悄悄进入夜色，细细地滋养万物，没有声响。田野间的小路和天空的云都一片漆黑，只有江上船中的灯火独自明亮。等到天亮再看，花朵被雨水润湿，饱含雨水的繁花将装点整个锦官城。","scene":"春夜细雨伴风而来，在无声中浸润大地。野路与乌云融入深暗夜色，江船灯火显得格外明亮。诗人的想象随后转向清晨，雨后鲜花湿润饱满，由眼前的静夜展开一幅将要出现的春城花景。","tone":"柔和、安静而充满喜悦，深暗夜色中仍有明亮温厚的期待。","emotion":"喜意从好雨的好字贯穿全篇：雨来得合时，又润物无声，因而值得欣慰。诗人的目光关切万物生长，最后以雨后花城寄托期待。黑云并不代表绝望，而是与灯火共同写出夜雨中的真实光色。","technique":"以知、潜等字赋予春雨人的情意，黑云与明火形成对照；末联由实景转入想象，以花湿花重具体表现雨的滋养。","categories":["calm"],"imagery":["雨","风","夜","野径","云","江船","火","花"],"sourceSearch":"春夜喜雨 杜甫","sourceUrl":"https://zh.wikisource.org/wiki/春夜喜雨","sourceVerified":true},{"id":"extra-zaocheng","title":"早春呈水部张十八员外·其一","author":"韩愈","dynasty":"唐","lines":["天街小雨润如酥，草色遥看近却无。","最是一年春好处，绝胜烟柳满皇都。"],"translation":"京城街道上落着细雨，润泽得像细腻的酥油。草色从远处看仿佛连成淡绿的一片，走近却还难以辨认。眼下正是一年中最美的春天时节，远远胜过柳色如烟、铺满京城的时候。","scene":"细雨润湿京城街道，初生小草稀疏细弱，远望才汇成朦胧的绿色，近看又融入泥土。诗人不追逐满城浓绿，而凝视这一点若有若无的春意，画面开阔清润，最动人的变化藏在细微之处。","tone":"清新、细腻而欣悦，以轻柔景色表现对早春生机的赞赏。","emotion":"诗人喜爱的是春天初来的新鲜感，而非浓艳繁盛本身。对远近草色的发现，显示出细致观察与主动寻春的兴味。结句的比较强调个人审美选择，不能理解为烟柳天然含有消极或悲伤意味。","technique":"以酥比喻细雨的润泽，借远看与近看形成视觉反差，再以早春草色对照盛春烟柳，用比较强化独到感受。","categories":["calm"],"imagery":["小雨","草色","烟柳"],"sourceSearch":"早春呈水部张十八员外二首 韩愈","sourceUrl":"https://zh.wikisource.org/wiki/早春呈水部張十八員外二首","sourceVerified":true,"note":"所收为组诗其一的完整四句；烟柳另有花柳异文。"},{"id":"extra-yugezi","title":"渔歌子·西塞山前白鹭飞","author":"张志和","dynasty":"唐","lines":["西塞山前白鹭飞，桃花流水鳜鱼肥。","青箬笠，绿蓑衣，斜风细雨不须归。"],"translation":"西塞山前白鹭飞翔，桃花盛开的时节，流水中的鳜鱼正肥。渔人戴着青色箬笠，披着绿色蓑衣，置身轻风斜雨之中，仍觉得无须归去。","scene":"山前白鹭掠过，桃花与春水相映，水中有肥美的鳜鱼。青笠绿蓑的渔人处于这片柔和的风雨之间，景物色彩鲜明却不喧闹。山、水、鸟与人相互容纳，构成适宜停留而不急于离开的江南春景。","tone":"清丽、舒缓而自在，细雨和微风增添闲适，并不制造凄苦。","emotion":"不须归是全词情意的落点，表现渔人安于眼前生活、乐在山水的姿态。白鹭、桃花和鳜鱼组成丰足而有生气的世界。可从中体会远离纷扰的愿望，但不必把每件景物都解释为政治象征。","technique":"以白、青、绿等色彩组织画面，将人物衣着融入自然；末句以直接的生活选择点出情意，景物描写因此有了主体。","categories":["calm"],"imagery":["西塞山","白鹭","桃花","流水","鳜鱼","箬笠","蓑衣","斜风","细雨"],"sourceSearch":"渔歌子 西塞山前白鹭飞 张志和","sourceUrl":"https://paper.people.com.cn/rmrbhwb/html/2015-07/17/content_1588284.htm","sourceVerified":true},{"id":"extra-xijiangyue","title":"西江月·夜行黄沙道中","author":"辛弃疾","dynasty":"宋","lines":["明月别枝惊鹊，清风半夜鸣蝉。","稻花香里说丰年，听取蛙声一片。","七八个星天外，两三点雨山前。","旧时茅店社林边，路转溪桥忽见。"],"translation":"明亮的月色惊动枝上的喜鹊，半夜的清风送来蝉鸣。稻花香中，人仿佛听见关于丰年的话语，四周蛙声响成一片。远天闪着稀疏的星，山前落下几点雨。以前熟悉的茅店就在土地庙旁的树林边，走过溪桥、道路一转，它忽然出现在眼前。","scene":"夜行乡间，月光、清风与稻花香相伴，鹊、蝉、蛙的声音让田野充满生命。天气渐变，疏星之外落来几点雨，行路人转过溪桥，忽见熟悉的茅店。夜色清幽，却始终有村落与收成带来的亲切感。","tone":"清幽而活泼，丰收的喜悦与忽见茅店的惊喜相互呼应。","emotion":"词人沉浸于田园夜色，并把蛙声听成丰年的消息，透露对农事与乡村生活的关切。结尾不是孤旅无依的悲叹，而是熟悉住所突然入眼的轻快转折。夜、雨、蝉在这里共同服务于喜悦的语境。","technique":"调动视觉、听觉与嗅觉，以蛙声引出丰收联想；上下片随步移景，七八、两三写疏朗，忽见形成自然的情节转折。","categories":["calm"],"imagery":["明月","鹊","清风","蝉","稻花","蛙声","星","雨","茅店","溪桥"],"sourceSearch":"西江月 夜行黄沙道中 辛弃疾","sourceUrl":"https://cd.edb.gov.hk/chi/resource/ncs/download/js_list/JS_xijiangyue.pdf","sourceVerified":true,"note":"溪桥有溪头异文；见在此表示显现。"},{"id":"extra-xiaochu","title":"晓出净慈寺送林子方·其二","author":"杨万里","dynasty":"宋","lines":["毕竟西湖六月中，风光不与四时同。","接天莲叶无穷碧，映日荷花别样红。"],"translation":"到底是六月的西湖，景色与其他时节大不相同。荷叶铺展到仿佛与天相接，碧绿无边；阳光照着荷花，使花朵显出格外鲜明的红色。","scene":"盛夏清晨的西湖铺满莲叶，碧色向远处延伸，几乎接上天际。大片绿叶间的荷花承受阳光，红得鲜明热烈。诗人以阔大视野把单朵荷花放进整片湖景，形成明亮、饱满且富有张力的夏日画面。","tone":"明艳、开阔而热烈，以鲜明红碧色彩表现夏日旺盛生命力。","emotion":"诗人赞叹六月西湖独有的风光，感情在无穷碧与别样红的强烈感受中展开。题目虽属送别，正文并未直接写离愁。理解时应先尊重诗中昂扬的观景体验，再体会与友人共赏美景的情境。","technique":"先以议论总起，再以具体景物证实；接天扩大空间，碧与红互相映衬，用色彩和尺度突出荷塘盛景。","categories":["vast"],"imagery":["西湖","莲叶","日","荷花"],"sourceSearch":"晓出净慈寺送林子方 杨万里","sourceUrl":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/recommended-passages/KS2_17.pdf","sourceVerified":true,"note":"所收为二首组诗中其二的完整四句；归入雄浑苍茫仅取空间开阔，作品并无苍凉底色。"},{"id":"extra-xiaochi","title":"小池","author":"杨万里","dynasty":"宋","lines":["泉眼无声惜细流，树阴照水爱晴柔。","小荷才露尖尖角，早有蜻蜓立上头。"],"translation":"泉眼静静流着，像舍不得让细水多流一点；树阴映在水面，仿佛喜爱这晴日的柔和。小小荷叶刚露出尖角，已经有蜻蜓停在它的顶端。","scene":"一方小池边，泉水缓缓流出，树影安静映在水上。视线从水与树移向刚冒出的荷叶尖角，恰好看见一只蜻蜓停驻。画面不依赖壮观景色，而从极小的空间和瞬间，显出初夏生命的灵动与安稳。","tone":"轻柔、清新且饶有趣味，小景中含着发现新生事物的喜悦。","emotion":"诗人带着温柔的关注观察池边生命，细流、树阴与荷叶都像有自己的心意。才与早构成的小小呼应，透露发现蜻蜓的惊喜。作品可让人感受生命成长，但不宜把后世励志引申当成唯一原意。","technique":"惜与爱将泉眼、树阴人格化；由环境转向特写，以才、早捕捉时机，蜻蜓的停驻使静景富有生命感。","categories":["calm"],"imagery":["泉眼","细流","树阴","水","小荷","蜻蜓"],"sourceSearch":"小池 杨万里","sourceUrl":"https://zh.wikisource.org/wiki/小池","sourceVerified":true},{"id":"extra-shanxing","title":"山行","author":"杜牧","dynasty":"唐","lines":["远上寒山石径斜，白云生处有人家。","停车坐爱枫林晚，霜叶红于二月花。"],"translation":"石头小路曲折地伸向深秋的山上，白云升起的地方隐约有人家。我停下车，只因为喜爱傍晚的枫林；经过秋霜的叶子，比二月春花还红。","scene":"石径斜上秋山，引着视线越过山坡，望见云气间的人家。车行至枫林便停下来，夕照中的霜叶成为画面的焦点。山路、白云与人家提供清远背景，浓红枫叶则让整个深秋山景显得鲜活而温暖。","tone":"明朗、鲜艳而有兴致，寒山秋霜并未使画面转向衰飒。","emotion":"停车这一动作明确表明诗人受美景吸引，爱字直接揭示欣赏之情。他把霜叶与春花相比，给予秋色更高的赞美。作品提醒读者：秋、寒、霜不能单独决定情绪，必须结合红与爱等语境线索。","technique":"以山路构成画面纵深，以停车完成视线转折；白云衬红叶，秋叶对比春花，结句突出对秋景的独特评价。","categories":["calm"],"imagery":["寒山","石径","白云","人家","枫林","霜叶","花"],"sourceSearch":"山行 杜牧","sourceUrl":"https://zh.wikisource.org/wiki/山行_(杜牧)","sourceVerified":true,"note":"白云生处有白云深处异文；坐在此意为因为。归类取清远山景，情绪以明快赏秋为主。"},{"id":"extra-sujiandejiang","title":"宿建德江","author":"孟浩然","dynasty":"唐","lines":["移舟泊烟渚，日暮客愁新。","野旷天低树，江清月近人。"],"translation":"把船移到烟雾笼罩的小洲旁停泊，日色将暮，旅人的愁绪又添了一层。原野空旷，远天仿佛低到树梢；江水澄澈，映在水中的月亮仿佛靠近了船上的人。","scene":"暮色中，小舟停在烟雾环绕的洲渚旁。辽阔原野使远天显得低垂，清澈江水把月影送到身边。景物既空旷又贴近旅人：远处天地无人可亲，近处只有一轮月亮，构成安静而含愁的夜泊图。","tone":"清寂、低回而含蓄，空旷天地中也有月光近人的一丝慰藉。","emotion":"客愁新点出羁旅者在日暮时重新涌起的忧愁，后两句并不直说愁因，而让空阔原野和清江月影承载心境。月近人既衬出独处，也可能给人陪伴感，因而作品不是单一、无转圜的凄凉。","technique":"先写泊舟事件并点明客愁，再以景结情；天低树与月近人形成对仗，把远近空间转化为旅人切身的感受。","categories":["sad","calm"],"imagery":["舟","烟渚","日暮","野","天","树","江","月"],"sourceSearch":"宿建德江 孟浩然","sourceUrl":"https://zh.wikisource.org/wiki/宿建德江","sourceVerified":true},{"id":"extra-zaohan","title":"早寒江上有怀","author":"孟浩然","dynasty":"唐","lines":["木落雁南度，北风江上寒。","我家襄水曲，遥隔楚云端。","乡泪客中尽，孤帆天际看。","迷津欲有问，平海夕漫漫。"],"translation":"树叶落下，雁群向南飞去，北风吹得江上寒冷。我家在襄水转弯处，远隔在楚地的云层那边。客居他乡，思乡的泪仿佛已经流尽，只能望着天边一片孤帆。迷失渡口想找人问路，眼前却只有暮色里平阔如海、漫无边际的江水。","scene":"落叶、南飞大雁与江上北风先写出早寒，随后视线越过楚云，遥想襄水边的家。天际孤帆渐远，暮色中的水面展开却没有清晰归路。辽远景物与近身寒意相接，让归乡愿望显得迫切而难达。","tone":"寒凉、苍茫而低沉，思乡愁绪逐渐汇入归路难明的迷惘。","emotion":"南飞的雁触动有家难归的旅人，乡泪直接写出深切乡愁。孤帆成为望归的依托，末联借问津又增加人生方向难定的意味。对仕隐选择的解读可以作为延伸，但全诗最确切的感情依据仍是羁旅思归。","technique":"以秋景起兴，借雁南飞引出故乡；空间由江面推向天际，以问津典故拓展意味，结尾用辽阔暮景收束愁情。","categories":["sad","vast"],"imagery":["木","雁","北风","江","襄水","楚云","孤帆","平海"],"sourceSearch":"早寒江上有怀 孟浩然","sourceUrl":"https://zh.wikisource.org/wiki/早寒江上有懷","sourceVerified":true,"note":"又题江上思归；襄水曲有襄水上等异文，孤帆有归帆异文。"},{"id":"extra-huanghelou","title":"黄鹤楼","author":"崔颢","dynasty":"唐","lines":["昔人已乘黄鹤去，此地空余黄鹤楼。","黄鹤一去不复返，白云千载空悠悠。","晴川历历汉阳树，芳草萋萋鹦鹉洲。","日暮乡关何处是？烟波江上使人愁。"],"translation":"传说中的仙人已经乘黄鹤离去，这里只留下黄鹤楼。黄鹤去了便不再回来，白云千年来仍悠悠飘荡。晴光中，汉阳一带的树木清晰可见，鹦鹉洲上芳草繁茂。天色将晚，我的家乡究竟在哪个方向？江上烟雾笼罩的波涛让人发愁。","scene":"登楼者先由眼前楼台追想仙人乘鹤的传说，白云把思绪牵向悠长岁月。再低头看晴川、树木与芳草，江洲历历在目。随着日暮到来，烟波模糊远方，阔大的山川景色最终转为乡关难寻的愁境。","tone":"起初高远苍茫，继而清丽明朗，末尾转入日暮思乡的惆怅。","emotion":"前半写人去楼空与岁月悠长的感慨，后半由登临所见引出思乡。眼前景物越清楚，远方故乡越难以抵达。芳草与白云的含义来自这一情感进程，不能脱离全篇分别固定为离别或闲适。","technique":"以传说起笔，虚实相接；黄鹤反复出现扩展回响，颈联工整对仗，尾联设问并以烟波景象收束乡愁。","categories":["vast","sad"],"imagery":["黄鹤","黄鹤楼","白云","晴川","树","芳草","鹦鹉洲","日暮","烟波"],"sourceSearch":"黄鹤楼 崔颢","sourceUrl":"https://zh.wikisource.org/wiki/黃鶴樓_(崔顥)","sourceVerified":true},{"id":"extra-huanghesong","title":"黄鹤楼送孟浩然之广陵","author":"李白","dynasty":"唐","lines":["故人西辞黄鹤楼，烟花三月下扬州。","孤帆远影碧空尽，唯见长江天际流。"],"translation":"老朋友从西边的黄鹤楼辞别，在花繁如烟的三月乘船去扬州。那一片孤帆越去越远，最终消失在碧蓝天际；我眼中只剩长江向天边流去。","scene":"春日送别发生在黄鹤楼畔，友人乘舟顺江远行，目的地是烟花繁盛的扬州。送行者的目光始终跟着帆影，直到它融入碧空，仍对着天际江流凝望。宏阔明丽的景色中，人的专注显得格外深情。","tone":"明丽、高远而含情，依依惜别藏在久久不移的目送之中。","emotion":"全诗不直接说舍不得，却用帆影消失后的继续凝望显示友情。烟花三月的明媚使送别带有向往与祝愿，情绪不是纯粹悲苦。孤帆突出诗人眼中的那一只船，也表现友人在他心中独特的位置。","technique":"通过帆影由有到无表现时间流逝与目送过程，以景结情；碧空、长江扩大空间，衬出凝望者持久的情感。","categories":["vast","sad"],"imagery":["黄鹤楼","烟花","孤帆","碧空","长江","天际"],"sourceSearch":"黄鹤楼送孟浩然之广陵 李白","sourceUrl":"https://zh.wikisource.org/wiki/黃鶴樓送孟浩然之廣陵","sourceVerified":true,"note":"碧空有碧山等异文；凄清分类仅提示惜别情意，正文景色本身明丽。"},{"id":"extra-wanglushan","title":"望庐山瀑布·其二","author":"李白","dynasty":"唐","lines":["日照香炉生紫烟，遥看瀑布挂前川。","飞流直下三千尺，疑是银河落九天。"],"translation":"阳光照着香炉峰，峰间升起紫色烟霞。远远看去，瀑布像悬挂在山前的长河。水流从高处飞奔而下，仿佛有三千尺之长，让人几乎以为是银河从极高的天空倾落下来。","scene":"阳光中的香炉峰被紫色烟霞笼罩，一道明亮瀑布悬于山前。远看似乎静挂，凝神又见水流疾速直下。诗人的想象越过山峰直抵天空，使眼前飞瀑与天上银河相连，形成高大、瑰丽且动势充沛的境界。","tone":"壮丽、昂扬而富于惊奇，瀑布的力量与奇幻色彩同时突出。","emotion":"诗人面对自然奇观，先欣赏其光色，再惊叹其高度与速度。疑是写出瞬间被美景震撼的感受，而非真实判断瀑布来自银河。诗中的夸张体现自由想象和赞美之情，不应当作地理尺寸记录。","technique":"紫烟与白色飞瀑形成鲜明光色；挂字写远观形态，飞、直写动态，三千尺的夸张和银河比喻把实景推向奇境。","categories":["vast"],"imagery":["日","香炉","紫烟","瀑布","飞流","银河","九天"],"sourceSearch":"望庐山瀑布 李白","sourceUrl":"https://zh.wikisource.org/wiki/望廬山瀑布","sourceVerified":true,"note":"所收为二首组诗中其二的完整四句；香炉指香炉峰。"},{"id":"extra-baidi","title":"早发白帝城","author":"李白","dynasty":"唐","lines":["朝辞白帝彩云间，千里江陵一日还。","两岸猿声啼不住，轻舟已过万重山。"],"translation":"清晨告别彩云环绕的白帝城，千里之外的江陵一天就能到达。两岸猿猴的叫声还接连不断，轻快的小船已经驶过层层山峦。","scene":"清晨从高处的白帝城出发，彩云在身后展开，小舟顺流穿行于两岸群山之间。猿啼接连传来，山峦却已迅速退向船后。遥远路程被压缩为轻快的一日，听觉的延续与视觉的飞逝共同写出舟行迅疾。","tone":"轻快、明朗而畅达，重山与猿啼共同衬托顺流疾行的喜悦。","emotion":"轻舟的轻既写船行迅速，也传达身心舒展的感受。诗人面对重重山峡并无畏缩，猿声尚在耳畔，人已越过万山。因此，不能套用猿啼必悲的习惯判断；全诗的时间节奏和动作词都指向畅快。","technique":"千里与一日构成距离和时间的强烈对照；猿声未住与轻舟已过交错，利用听觉延续衬托速度，万重夸张山势。","categories":["vast"],"imagery":["彩云","猿声","轻舟","山"],"sourceSearch":"早发白帝城 李白","sourceUrl":"https://zh.wikisource.org/wiki/早發白帝城","sourceVerified":true,"note":"啼不住有啼不尽异文。归类取群山江峡的壮阔；全诗主调轻快，不属凄清。"},{"id":"extra-dujingmen","title":"渡荆门送别","author":"李白","dynasty":"唐","lines":["渡远荆门外，来从楚国游。","山随平野尽，江入大荒流。","月下飞天镜，云生结海楼。","仍怜故乡水，万里送行舟。"],"translation":"远行渡过荆门之外，来到楚地游历。山峦随着平野展开而渐渐消失，大江流向广阔原野。月亮映入水中，像一面从天上飞来的明镜；升起的云彩像结成海市中的楼台。我仍然眷恋故乡的江水，它仿佛不远万里，一路送着我的船。","scene":"船出荆门，夹岸山势逐渐让位于辽阔平原，大江向远处舒展开去。夜间月影如镜，天上云气如楼，天地水面不断出现新景。壮阔的出游视野最终落到身边江水，使辽远行程保留一条与故乡相连的线索。","tone":"开阔、新奇而昂扬，结尾转为温柔的故乡眷恋，情绪并不沉重。","emotion":"初入开阔天地的兴奋与离乡后的留恋并存。诗人没有直接说自己舍不得故乡，却说故乡水远送行舟，把自身情意转写为江水的陪伴。这里的送别主要指故乡之水送自己远行，不宜强说另有送别友人。","technique":"以移动视点写山尽江流，天镜、海楼比喻月影云气；末联拟人，让故乡水成为送行者，含蓄表达眷恋。","categories":["vast","calm"],"imagery":["山","平野","江","大荒","月","天镜","云","海楼","故乡水","行舟"],"sourceSearch":"渡荆门送别 李白","sourceUrl":"https://zh.wikisource.org/wiki/渡荊門送別","sourceVerified":true},{"id":"extra-poshansi","title":"题破山寺后禅院","author":"常建","dynasty":"唐","lines":["清晨入古寺，初日照高林。","曲径通幽处，禅房花木深。","山光悦鸟性，潭影空人心。","万籁此都寂，但余钟磬音。"],"translation":"清早走进古寺，初升的太阳照着高高的树林。弯曲小路通向幽静深处，禅房掩映在繁密花木间。山中光景让鸟儿自在欢悦，潭水的倒影使人心中的杂念渐渐消散。周围的一切声音仿佛都静了，只留下钟与磬的清音。","scene":"清晨阳光进入高林，小路蜿蜒通向花木深处的禅房。山光、鸟影与澄潭相映，使行人的心绪逐渐平静。结尾传来悠长钟磬声，声音并未打破清幽，反而让古寺深处的空静空间变得更可感知。","tone":"清幽、澄澈而宁静，以安定的感官体验引向内心的清明。","emotion":"诗人被寺院环境吸引，经历从观景到心静的变化。空人心表达杂念消歇的感受，既含有佛寺语境，也可体会为暂离尘扰的安适。幽深不等于阴森，万籁俱寂更不必解释为死亡或绝望。","technique":"以入寺行踪逐层深入，景与心相互映照；悦、空突出景物作用，末联以钟磬声衬托幽静，形成有声中的空寂。","categories":["calm","noble"],"imagery":["古寺","初日","高林","曲径","禅房","花木","山光","鸟","潭影","钟磬"],"sourceSearch":"题破山寺后禅院 常建","sourceUrl":"https://zh.wikisource.org/wiki/題破山寺後禪院","sourceVerified":true,"note":"曲径有竹径异文；万籁此都寂有万籁此俱寂异文，但余有惟闻异文。"},{"id":"extra-tijuhua","title":"题菊花","author":"黄巢","dynasty":"唐","lines":["飒飒西风满院栽，蕊寒香冷蝶难来。","他年我若为青帝，报与桃花一处开。"],"translation":"飒飒秋风里，满院栽着菊花；花蕊带寒，香气清冷，连蝴蝶都难来亲近。有一天，假如我成为掌管春天的神，我就要让菊花和桃花在同一个春天开放。","scene":"满院花朵处在西风吹拂之中，寒蕊冷香使秋日庭院显得寂寥，蝴蝶也很少飞来。画面随即越出眼前季节，转向菊与桃花同开的想象春天。冷清实景与温暖愿景形成鲜明对照，意境由孤立走向改变。","tone":"先清冷孤寂，后转为昂扬而带挑战意味的愿望与自信。","emotion":"诗人不满足于赞美菊花耐寒，而为它不能享有春日温暖感到不平。成为青帝的设想表达改变不公处境的愿望，带有强烈主体意识。理解时可以联系抱负，但不宜把每一种花机械对应某个固定社会群体。","technique":"西风、寒蕊、冷香共同写冷落处境，后两句以假设和神话想象转折；托物言志，通过改变花期表达改变命运的愿望。","categories":["noble","sad"],"imagery":["西风","蕊","香","蝶","桃花"],"sourceSearch":"题菊花 黄巢","sourceUrl":"https://zh.wikisource.org/wiki/題菊花","sourceVerified":true,"note":"正文未出现菊字，菊花的指向来自标题与全诗语境，故 imagery 不直接列菊。"},{"id":"extra-budihou","title":"不第后赋菊","author":"黄巢","dynasty":"唐","lines":["待到秋来九月八，我花开后百花杀。","冲天香阵透长安，满城尽带黄金甲。"],"translation":"等到秋天九月初八，我所钟爱的菊花盛开时，别的花已经凋零。阵阵花香直冲天空，传遍长安；满城金黄的花朵，仿佛都披上了黄金铠甲。","scene":"诗人想象秋日花开之时，群芳凋谢，而自己钟爱的花占满长安。香气被写成冲天而起的阵势，金黄色花瓣化为满城铠甲。原本属于庭园的花被放大到整座城市，画面充满集体铺展和向外推进的力量。","tone":"雄健、强烈而充满自信，金黄色与冲天气势构成昂扬的声调。","emotion":"我花带有鲜明的认同与自许，诗人把落第后的不平转化为胜出的想象。这里的花不再只是淡泊隐逸的象征，而被赋予力量与抱负。杀在句中指百花凋零，不能直接当作现实暴力行为的叙述。","technique":"以未来设想统摄全篇，用我花与百花对照；将香气写成阵势、金花比作铠甲，夸张与比喻共同制造雄壮气势。","categories":["vast","noble"],"imagery":["花","百花","香阵","黄金甲"],"sourceSearch":"不第后赋菊 黄巢","sourceUrl":"https://zh.wikisource.org/wiki/不第後賦菊","sourceVerified":true,"note":"正文未出现菊字；黄金甲是菊花颜色与形态引出的比喻意象，不是实写军队。"},{"id":"extra-huaju","title":"画菊","author":"郑思肖","dynasty":"宋末元初","lines":["花开不并百花丛，独立疏篱趣未穷。","宁可枝头抱香死，何曾吹落北风中。"],"translation":"花朵开放时不与百花挤在一处，独自立在稀疏篱边，意趣仿佛无穷无尽。它宁愿留在枝头，守着清香枯萎，又何曾任由北风把自己吹落？","scene":"一丛花独立于稀疏篱笆旁，不以百花簇拥为热闹，也不追逐共同开放的时令。随后视线落到枝头，花即便枯萎仍保持姿态与清香。北风构成外在压力，疏篱与枝头则成为坚守自身的位置。","tone":"清峻、坚定而有抗争意味，独立之姿贯穿到最后的反问。","emotion":"诗人借菊花不随风飘落的形象表达对操守的坚持。宁可与何曾使态度十分坚决，结合作者的遗民身份，可读出不屈服与守故国之志。这里描写的是文学化品格，不应当作适用于所有菊种的植物学规律。","technique":"托物言志，以菊的独立、抱香寄托人格；前后由姿态推进到选择，末句反问强化决心，北风兼有外力压迫的象征意味。","categories":["noble"],"imagery":["花","百花","疏篱","枝头","香","北风"],"sourceSearch":"画菊 郑思肖","sourceUrl":"https://fanti.dugushici.com/ancient_proses/70378","sourceVerified":true,"note":"又题寒菊。正文依通行版本核对；古籍传本有吹堕等异文。正文未出现菊字。"},{"id":"extra-yongliu","title":"咏柳","author":"贺知章","dynasty":"唐","lines":["碧玉妆成一树高，万条垂下绿丝绦。","不知细叶谁裁出，二月春风似剪刀。"],"translation":"高高的柳树像用碧玉装扮而成，垂下的无数枝条好似绿色丝带。不知这样细巧的叶子是谁裁出来的？原来二月春风就像一把剪刀。","scene":"高柳披上新绿，细长枝条垂落，仿佛碧玉与丝带构成的装饰。目光由整树转向一片片细叶，又由叶的精巧形态想到春风的创造。春日常见的一株树因此显出柔美、轻盈和蓬勃更新的趣味。","tone":"清丽、轻盈而充满赞叹，巧妙设问使春景带有活泼的想象。","emotion":"诗人赞赏柳树新生的姿态，也赞赏春天使万物焕新的力量。最后把功劳归于春风，形成愉悦的发现。柳在此不服务于折柳送别或思乡，而是春意的直接呈现，判断情感必须以具体句子为依据。","technique":"连续运用碧玉、丝绦、剪刀三个比喻；视点由整体到细部，后两句设问自答，把无形春风写成有手艺的创造者。","categories":["calm"],"imagery":["碧玉","树","绿丝绦","细叶","春风","剪刀"],"sourceSearch":"咏柳 贺知章","sourceUrl":"https://zh.wikisource.org/wiki/詠柳_(賀知章)","sourceVerified":true,"note":"柳字只在标题，正文用树、细叶与比喻描写柳树。分类取自然清新，主调是明快赞春。"},{"id":"extra-songyuaner","title":"送元二使安西","author":"王维","dynasty":"唐","lines":["渭城朝雨浥轻尘，客舍青青柳色新。","劝君更尽一杯酒，西出阳关无故人。"],"translation":"渭城清晨的雨润湿了路上轻尘，客舍旁一片青翠，柳色显得新鲜。请你再饮尽这一杯酒吧，向西出了阳关，就难有熟识的老朋友相伴了。","scene":"清晨小雨洗净道路，客舍与柳树显得格外清新。送别却在这样宜人的景色中进行，一杯酒把即将启程的人暂时留住。视线由近处酒席转向遥远阳关，鲜明的眼前春色与前路陌生感形成含蓄张力。","tone":"清新而深情，温厚劝酒之中藏着分别在即的不舍与关切。","emotion":"更尽一杯透露送行者还想多留片刻，无故人则是对友人远行后少有人照应的担忧。雨后柳色本身明净，并非衰败景象；正因景美而友人将去，离情更显细腻。全诗以关怀为主，不作绝望之语。","technique":"前两句以清新景色铺垫，后两句转为直接对话；更字体现反复挽留，一杯酒承载难以说尽的友情，近景与远途相接。","categories":["sad"],"imagery":["朝雨","轻尘","客舍","柳","酒","阳关"],"sourceSearch":"送元二使安西 王维","sourceUrl":"https://zh.wikisource.org/wiki/送元二使安西","sourceVerified":true,"note":"凄清分类只用于离别情绪；诗的景色清新，情意温厚。"},{"id":"extra-wenchangling","title":"闻王昌龄左迁龙标遥有此寄","author":"李白","dynasty":"唐","lines":["杨花落尽子规啼，闻道龙标过五溪。","我寄愁心与明月，随君直到夜郎西。"],"translation":"杨花将落尽，子规不断啼叫的时候，我听说你被贬到龙标，已经走过五溪。我要把牵挂而忧伤的心托付给明月，让它陪着你，一直到夜郎以西。","scene":"暮春杨花飘尽，子规啼声在远近回荡，友人贬谪的消息使景色带上离愁。诗人无法亲自陪行，便转向能照见两地的明月。现实中的遥远路途与想象中的月光相连，构成隔空寄意、一路相随的画面。","tone":"感伤、恳切而温柔，暮春凄清最终化为遥远而持久的关怀。","emotion":"愁心既含听到友人遭贬的忧虑，也含不能相伴的遗憾。明月成为情意的传递者，使无法实现的陪伴获得想象形式。子规与杨花的伤感作用有明确事件支撑，不能将它们在所有作品中的意味一概固定。","technique":"以杨花、子规渲染暮春氛围，借五溪交代路途之远；将明月人格化，以寄心、随行的浪漫想象把友情化为可见行动。","categories":["sad"],"imagery":["杨花","子规","五溪","明月"],"sourceSearch":"闻王昌龄左迁龙标遥有此寄 李白","sourceUrl":"https://zh.wikisource.org/wiki/聞王昌齡左遷龍標遙有此寄","sourceVerified":true,"note":"随君有随风异文；龙标在闻道龙标句中以任所代指王昌龄。"},{"id":"extra-youziyin","title":"游子吟","author":"孟郊","dynasty":"唐","lines":["慈母手中线，游子身上衣。","临行密密缝，意恐迟迟归。","谁言寸草心，报得三春晖。"],"translation":"慈爱的母亲拿着针线，为将要远行的孩子缝制衣裳。临出发前，她把针脚缝得格外细密，心里担心孩子久久不能归来。谁能说，小草般微小的心意，能够报答整个春天阳光般深厚的恩情呢？","scene":"离家之前，母亲手中的线与游子身上的衣紧密相连，细密针脚记录着未说出口的牵挂。画面随后从家中缝衣的小景转入春日草木与阳光，以宽广温暖的自然形象照见日常劳动中深厚而持久的母爱。","tone":"朴素、温暖而恳切，离别的牵挂最终汇成感恩与珍惜。","emotion":"母亲担心孩子迟归，于是把关爱落实在缝衣的动作里；游子回望这份付出，感到自身报答仍显微小。诗赞美养育与照料的深情，重心并非隐逸或悲凉，也不应把反问理解为对子女的道德责罚。","technique":"以线、衣的白描呈现亲情，用密密与迟迟的叠词对应动作和忧虑；结尾以寸草、春晖作比，并用反问深化感恩。","categories":["calm"],"imagery":["线","衣","寸草","三春晖"],"sourceSearch":"游子吟 孟郊","sourceUrl":"https://zh.wikisource.org/wiki/遊子吟_(孟郊)","sourceVerified":true,"note":"四类框架不能准确概括本诗；暂归平和日常一侧，实际主旨是温暖亲情与感恩，宜作为分类边界例。"},{"id":"extra-busuanzi","title":"卜算子·咏梅","author":"陆游","dynasty":"宋","lines":["驿外断桥边，寂寞开无主。","已是黄昏独自愁，更著风和雨。","无意苦争春，一任群芳妒。","零落成泥碾作尘，只有香如故。"],"translation":"驿站外的断桥旁，梅花独自开放，没有人照料。已经到了黄昏，它独自承受愁苦，又遭遇风吹雨打。它无意费力争取春日的荣宠，任凭别的花嫉妒。即使凋落成泥，又被碾为尘土，清香仍旧不变。","scene":"无人照料的花开在驿站外、断桥边，黄昏光线渐暗，风雨又来侵袭，环境层层加深孤苦。后半从花的处境转向它的姿态，即使落地成尘，仍保有清香。外在衰损与内在不改构成鲜明对照。","tone":"前半凄清孤寂，后半沉静而坚毅，困厄中保持不改的操守。","emotion":"词人借梅花的寂寞处境寄托失意与孤独，又以不争春、香如故表达不随俗的坚持。风雨可以读作外在打击的象征，但不必逐一对应具体人物。情感并未停在自怜，而是在最后落向人格的自守。","technique":"通篇托物言志，以拟人写花的愁与不争；黄昏、风雨层层衬托处境，成泥作尘与香如故的对照突出内在品格。","categories":["noble","sad"],"imagery":["驿","断桥","黄昏","风","雨","群芳","泥","尘","香"],"sourceSearch":"卜算子 咏梅 陆游","sourceUrl":"https://zh.wikisource.org/wiki/放翁詞_(四庫全書本)","sourceVerified":true,"note":"著与着为此处常见用字差异；梅字仅见于题目，正文以其处境、姿态与花香呈现意象。"}],"rawEntryCount":498,"sourceName":"sdl 1.docx","version":"1.0"}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('poetry-data').textContent);
const MOODS=[{id:'vast',name:'雄浑苍茫',short:'苍茫',desc:'含边塞、怀古、壮志兴亡',note:'辽阔的空间、历史的纵深与昂扬的气势，共同构成苍茫的天地。留意景物的尺度，以及诗人如何置身其中。',number:'01',english:'VAST & SUBLIME'},{id:'calm',name:'冲淡闲远',short:'闲远',desc:'平和悠然，田园隐逸、静赏自然',note:'细小的声响、舒缓的节奏与日常景物，常写出亲近自然的悠然。安静不等于没有情感，要看诗人如何选择与安排景物。',number:'02',english:'QUIET & SERENE'},{id:'sad',name:'凄清幽寂',short:'幽寂',desc:'冷寂落寞，羁旅、离别、怀人、失意',note:'冷色、暮色、孤独的身影与遥远的距离，常把离愁或失意写进景物。联系全诗，辨别这份孤独究竟从何而来。',number:'03',english:'LONELY & WISTFUL'},{id:'noble',name:'清峻孤高',short:'孤高',desc:'洁傲自持，咏物言志、坚守品格',note:'诗人借寒中之花、风中之竹等形象表现坚守。注意物的处境、品质与人的志向如何对应，不把所有清冷景物都读成高洁。',number:'04',english:'PURE & RESOLUTE'}];
const M=Object.assign(Object.create(null),Object.fromEntries(MOODS.map(x=>[x.id,x])));
const main=document.getElementById('main');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').trim().replace(/\s/g,'').replace(/楓/g,'枫').toLowerCase();
const byId=Object.assign(Object.create(null),Object.fromEntries(DATA.imagery.map(x=>[x.id,x])));
const poemById=Object.assign(Object.create(null),Object.fromEntries(DATA.poems.map(x=>[x.id,x])));
let saved=new Set();let storageAvailable=true;try{const value=JSON.parse(localStorage.getItem('shijing-saved-v1')||'[]');if(Array.isArray(value))saved=new Set(value.filter(id=>poemById[id]));}catch{storageAvailable=false;}
const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>';
const arrowIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
const drawings={vast:'<path d="M2 79 29 31 52 65 76 9 109 78M18 80h92M0 90h115"/><circle cx="23" cy="22" r="12"/>',calm:'<path d="M0 79q25-12 50 0t65 0M5 90q25-9 45 0t60 0M42 69V32m0 12Q20 21 13 38q12 11 29 6m0 12q22-28 39-12-11 17-39 12M82 69V18m0 20q-15-17-24-10 6 14 24 10"/>',sad:'<path d="M5 85q20-10 42 0t65 0M11 94q20-6 40 0t55 0M24 70h63L75 80H36zM57 68V34m0 0L82 63H57"/><path d="M47 7a23 23 0 1 0 28 33A26 26 0 0 1 47 7Z"/>',noble:'<path d="M46 95 51 8M63 97 77 22M49 33l-16-12M48 53l22-18M47 76l-23-17M70 57l22-12M65 80l19-10M47 27h6M46 48h7M45 70h8M69 51h7M65 73h7"/><path d="m33 21-18-3 9 12Zm37 14 17-12-5 15ZM24 59 8 55l10 14Zm68-14 20-5-13 15ZM84 70l22-1-16 9Z"/>'};
function art(id){return '<svg class="mood-illustration" viewBox="0 0 120 105" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">'+drawings[id]+'</svg>';}
function searchForm(value='',context='main'){return '<form class="search-form" data-search><label for="search-'+context+'" class="sr-only">请输入你想查询的意象</label>'+searchIcon+'<input id="search-'+context+'" name="query" type="search" maxlength="50" value="'+E(value)+'" autocomplete="off" placeholder="请输入你想查询的意象" required><button class="search-submit" type="submit" aria-label="查询意象"><span>寻境</span>'+arrowIcon+'</button></form>';}
function moodCard(m,action='category',image=null){const count=image?matches(image,m.id).length:DATA.imagery.filter(x=>x.categories.includes(m.id)).length;return '<button class="mood-card" data-mood="'+m.id+'" data-'+action+'="'+m.id+'"'+(image?' data-image="'+image.id+'"':'')+' aria-label="'+E(m.name+'的意象，'+(image?'查看例诗':'浏览意象'))+'"><div class="mood-top"><span>'+m.number+' / '+(image?(count?'有 '+count+' 首参考诗词':'例诗待补充'):count+' 个意象')+'</span><span class="arrow" aria-hidden="true">↗</span></div>'+art(m.id)+'<div><h2>'+m.name+'<small>的意象</small></h2><p>'+m.desc+'</p></div></button>';}
function crumb(parts=[]){return '<div class="breadcrumb"><a href="#home">首页</a>'+parts.map(p=>'<span class="crumb-sep" aria-hidden="true">/</span>'+(p.href?'<a href="'+E(p.href)+'">'+E(p.text)+'</a>':'<span>'+E(p.text)+'</span>')).join('')+'</div>';}
function route(hash){if(location.hash===hash){render();window.scrollTo(0,0);}else location.hash=hash;}

const IMAGE_FAMILIES={

function poemTerms(image,poem){
  const body=poem.lines.join('');
  const tags=poem.imagery.map(normalize);
  return [...new Set(image.terms.flatMap(term=>{
    const key=normalize(term),allowed=[key,...(IMAGE_FAMILIES[key]||[]).map(normalize)];
    if(!key||!tags.some(tag=>allowed.includes(tag)))return [];
    const actual=body.includes(term)?term:(body.includes(key)?key:null);
    return actual?[actual]:[];
  }))];
}
const matchCache=new Map();
function matches(image,mood){const key=image.id+'/'+(mood||'');if(!matchCache.has(key))matchCache.set(key,DATA.poems.filter(p=>(!mood||p.categories.includes(mood))&&poemTerms(image,p).length>0));return matchCache.get(key);}
function countAvailable(image,mood){if(mood)return matches(image,mood).length;return DATA.poems.filter(p=>p.categories.some(c=>image.categories.includes(c))&&poemTerms(image,p).length).length;}
function findImages(q){const nq=normalize(q);return DATA.imagery.filter(x=>normalize(x.label).includes(nq)||x.terms.some(t=>normalize(t).includes(nq)));}
function exactImages(q){const nq=normalize(q);return DATA.imagery.filter(x=>normalize(x.label)===nq||x.terms.some(t=>normalize(t)===nq));}
function search(q){q=q.trim();if(!q){toast('请输入一个意象，例如：落日、雪、菊。');return;}const exact=exactImages(q);if(exact.length===1){imageRoute(exact[0].id);return;}route('#search/'+encodeURIComponent(q));}

let catalogState={mood:'',query:'',onlyReady:false,page:1};
function catalogView(mood='',query=''){catalogState={mood,query,onlyReady:false,page:1};return '<div class="inner-main view-enter">'+crumb([{text:'意象索引'}])+'<div class="page-heading"><div><div class="eyebrow">THE IMAGERY INDEX</div><h1>'+(mood?M[mood].name+'的意象':'每一个意象，都有回声。')+'</h1><p>'+(mood?M[mood].desc+'。选择一个意象，阅读这一意境下的诗词。':'按原稿保留全部意象与分类。同一意象可以通向不同意境；有例诗的条目会优先显示。')+'</p></div><div class="page-count">'+(mood?DATA.imagery.filter(x=>x.categories.includes(mood)).length:DATA.imagery.length)+'<small>个意象 · 原稿索引</small></div></div><div class="inner-search"><label class="sr-only" for="catalog-query">筛选意象索引</label><div class="search-form">'+searchIcon+'<input id="catalog-query" type="search" maxlength="50" value="'+E(query)+'" placeholder="在索引中查找，如：风、花、江水" autocomplete="off"></div></div><div class="filter-row"><button class="filter-pill '+(!mood?'active':'')+'" data-filter="" aria-pressed="'+(!mood)+'">全部意象</button>'+MOODS.map(m=>'<button class="filter-pill '+(mood===m.id?'active':'')+'" data-filter="'+m.id+'" aria-pressed="'+(mood===m.id)+'">'+m.name+'</button>').join('')+'<label class="ready-filter"><input id="only-ready" type="checkbox">只看已有例诗</label></div><div id="catalog-results" aria-live="polite"></div></div>';}
function entryCard(x,mood){const count=countAvailable(x,mood);return '<button class="image-entry" data-image="'+x.id+'"'+(mood?' data-open-mood="'+mood+'"':'')+'><span class="entry-label">'+E(x.label)+'</span><span class="go" aria-hidden="true">↗</span><div class="entry-meta">'+(count?'<span class="ready-dot" aria-hidden="true"></span>'+count+' 首参考诗词':'例诗待补充')+'</div></button>';}
function updateCatalog(){const holder=document.getElementById('catalog-results');if(!holder)return;const {mood,query,onlyReady}=catalogState;let list=DATA.imagery.filter(x=>(!mood||x.categories.includes(mood))&&(!query||findImages(query).includes(x)));if(onlyReady)list=list.filter(x=>countAvailable(x,mood)>0);list.sort((a,b)=>countAvailable(b,mood)-countAvailable(a,mood)||a.id.localeCompare(b.id));const pageSize=40;const pages=Math.max(1,Math.ceil(list.length/pageSize));catalogState.page=Math.min(catalogState.page,pages);const page=catalogState.page;holder.innerHTML='<div class="catalog-caption"><span>找到 '+list.length+' 个意象'+(query?' · “'+E(query)+'”':'')+'</span><span>依例诗数量排列 · 点击继续</span></div>'+(list.length?'<div class="image-grid">'+list.slice((page-1)*pageSize,page*pageSize).map(x=>entryCard(x,mood)).join('')+'</div><div class="pagination"><button class="outline-button" data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>← 上一页</button><span>第 '+page+' / '+pages+' 页 · 每页最多 40 项</span><button class="outline-button" data-page="'+(page+1)+'" '+(page===pages?'disabled':'')+'>下一页 →</button></div>':'<div class="empty"><div class="empty-symbol" aria-hidden="true">寻</div><h2>这里还没有找到匹配项。</h2><p>试试更短的词，或取消“只看已有例诗”。原稿中的生僻意象仍保留在完整索引中。</p><button class="outline-button" data-reset-filters>清除筛选</button></div>');}
function searchView(q){const exact=exactImages(q),found=exact.length?exact:findImages(q);return '<div class="inner-main view-enter">'+crumb([{text:'搜索意象'}])+'<div class="page-heading"><div><div class="eyebrow">FIND AN IMAGE</div><h1>寻找「'+E(q)+'」</h1><p>'+(exact.length>1?'这个词对应不止一个条目，请先选择你要了解的意象。':'选择一个条目，再选择想了解的意境。')+'</p></div></div><div class="inner-search">'+searchForm(q,'results')+'</div>'+(found.length?'<div class="catalog-caption"><span>'+found.length+' 个相关意象</span></div><div class="image-grid">'+found.map(x=>entryCard(x,'')).join('')+'</div>':'<div class="empty"><div class="empty-symbol" aria-hidden="true">寻</div><h2>这一个意象，暂未收录。</h2><p>目前检索的是原稿意象库。你可以试试相关词，或进入完整索引浏览；这里不会凭空生成诗词。</p><div class="quick-options">'+['落日','雪','菊','柳'].map(x=>'<button data-query="'+x+'">'+x+'</button>').join('')+'</div><a class="outline-button" href="#library">浏览完整意象索引 →</a></div>')+'</div>';}
function chooseView(image){return '<div class="inner-main view-enter">'+crumb([{text:'意象索引',href:'#library'},{text:image.label}])+'<div class="page-heading"><div><div class="eyebrow">ONE IMAGE · DIFFERENT WORLDS</div><h1>'+E(image.label)+'</h1><p>这个意象在原稿中归入 '+image.categories.length+' 类意境。先选择阅读角度，再看诗句如何形成这种氛围。</p></div></div><div class="mood-grid select-grid">'+image.categories.map(c=>moodCard(M[c],'choose',image)).join('')+'</div><p class="notice">意象是诗中的具体形象，意境是景物与情感共同形成的整体氛围。分类是阅读的起点，最终判断要回到全诗；同一个词并不总表达同一种感情。</p>'+bottomSearch()+'</div>';}
function highlight(text,terms){const escaped=terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).filter(Boolean).sort((a,b)=>b.length-a.length);if(!escaped.length)return E(text);const re=new RegExp('('+escaped.join('|')+')','g');return text.split(re).map((part,i)=>i%2?'<mark>'+E(part)+'</mark>':E(part)).join('');}
function renderPoem(poem,index,image=null,mood=null){const terms=image?poemTerms(image,poem):[];const evidence=image?poem.lines.filter(line=>terms.some(t=>normalize(line).includes(normalize(t)))):[];const source=poem.sourceVerified&&poem.sourceUrl?poem.sourceUrl:'https://zh.wikisource.org/w/index.php?search='+encodeURIComponent(poem.title+' '+poem.author);const sourceLabel=poem.sourceVerified&&poem.sourceUrl?'原文出处 ↗':'在维基文库检索原文 ↗';return '<article class="poem-section" id="poem-'+E(poem.id)+'"><div class="poem-text"><div class="poem-ordinal"><span>POEM / '+String(index+1).padStart(2,'0')+'</span><button class="save-button" data-save="'+E(poem.id)+'" aria-pressed="'+saved.has(poem.id)+'">'+(saved.has(poem.id)?'已收藏 ✓':'收藏此诗 ＋')+'</button></div><h2>'+E(poem.title)+'</h2><div class="poem-author">'+E(poem.dynasty)+' · '+E(poem.author)+'</div><div class="verses">'+poem.lines.map(line=>'<p class="verse">'+highlight(line,terms)+'</p>').join('')+'</div>'+(poem.note?'<p class="poem-note">'+E(poem.note)+'</p>':'')+'<a class="source-link" href="'+E(source)+'" target="_blank" rel="noopener noreferrer">'+sourceLabel+' <span>（需联网）</span></a><details class="translation"><summary>白话译文</summary><p>'+E(poem.translation)+'</p></details></div><div class="poem-analysis">'+(image?'<div class="evidence"><div class="evidence-label">从原句看意象 · '+E(terms.join(' / '))+'</div>'+evidence.map(line=>'“'+highlight(line,terms)+'”').join('<br>')+'</div>':'')+'<div class="analysis-grid"><section class="analysis-item"><h3>意境 · 景与情如何相融</h3><p>'+E(poem.scene)+'</p></section><section class="analysis-item tone"><h3>情感基调</h3><p>'+E(poem.tone)+'</p></section><section class="analysis-item"><h3>思想感情</h3><p>'+E(poem.emotion)+'</p></section><section class="analysis-item"><h3>表达手法</h3><p>'+E(poem.technique)+'</p></section><section class="analysis-item"><h3>诗中的其他意象</h3><div class="other-images">'+poem.imagery.filter(t=>!terms.includes(t)).map(t=>{const found=exactImages(t);return found.length?'<button data-query="'+E(t)+'">'+E(t)+' ↗</button>':'<span>'+E(t)+'</span>';}).join('')+'</div></section></div></div></article>';}
function bottomSearch(){return '<section class="bottom-search"><div class="eyebrow">继续寻找，下一个意象</div>'+searchForm('','bottom')+'</section>';}
let currentReading=null;
function readingView(image,mood){currentReading={image,mood};const all=matches(image,mood),shown=all.slice(0,3),other=image.categories.filter(c=>c!==mood&&matches(image,c).length);return '<div class="inner-main view-enter">'+crumb([{text:M[mood].name,href:'#category/'+mood},{text:image.label}])+'<div class="result-title"><div class="eyebrow">READ THE IMAGE · FEEL THE POEM</div><div class="result-heading-row"><div><h1>'+E(image.label)+'</h1><div class="sub">从「'+M[mood].name+'」读懂这个意象</div></div><div class="action-group"><button class="outline-button" data-copy-reading '+(!shown.length?'disabled':'')+'>复制研读笔记</button><button class="outline-button" data-print>打印 / 存为 PDF</button></div></div></div><div class="category-ribbon" aria-label="切换这个意象的意境">'+image.categories.map(c=>'<button class="ribbon-item '+(c===mood?'selected':'')+'" data-mood="'+c+'" data-choose="'+c+'" data-image="'+image.id+'" aria-pressed="'+(c===mood)+'">'+M[c].name+'<small>'+(c===mood?'当前意境':'切换阅读')+'</small></button>').join('')+'</div><div class="reading-intro"><div class="eyebrow">READING NOTES</div><p>'+M[mood].note+'</p></div>'+(shown.length?'<p class="results-note">'+(all.length>3?'选读 3 首 · 该组合共收录 '+all.length+' 首':'已收录 '+all.length+' 首参考诗词'+(all.length<2?' · 更多同类例诗待补充':''))+'。高亮词语均出现在诗歌正文；同组别名按原稿处理。</p>'+shown.map((p,i)=>renderPoem(p,i,image,mood)).join('')+(shown.length>1?'<section class="comparison"><h2>同一个意象，为什么读来不同？</h2><p>先看意象与什么景物相邻，再看它在全诗中承担什么作用。可以从下面几种语境对照着读。</p><div class="comparison-list">'+shown.map(p=>'<div class="comparison-item"><h3>《'+E(p.title)+'》</h3><p>'+E(p.tone)+'</p><p>'+E(p.emotion)+'</p></div>').join('')+'</div></section>':''):'<div class="empty"><div class="empty-symbol" aria-hidden="true">待</div><h2>这一组「意象 × 意境」的例诗待补充。</h2><p>索引保留了原稿的“'+E(image.label)+' · '+M[mood].name+'”分类，目前还没有收录正文含该意象、且语境合适的诗词。这不代表古诗中不存在对应作品。</p>'+(other.length?'<p style="margin-top:12px">这个意象在以下意境中已有例诗：</p><div class="quick-options">'+other.map(c=>'<button data-choose="'+c+'" data-image="'+image.id+'">'+M[c].name+' →</button>').join('')+'</div>':'')+'<a class="outline-button" href="#category/'+mood+'">返回这一意境的意象索引 →</a></div>')+bottomSearch()+'</div>';}
function savedView(){const poems=DATA.poems.filter(p=>saved.has(p.id));return '<div class="inner-main view-enter">'+crumb([{text:'我的收藏'}])+'<div class="page-heading"><div><div class="eyebrow">YOUR READING COLLECTION</div><h1>留住读到的心意。</h1><p>已收藏 '+poems.length+' 首诗词。收藏保存在当前浏览器；移动文件或更换浏览器后，记录可能不会跟随。</p></div></div>'+(poems.length?poems.map((p,i)=>renderPoem(p,i)).join(''):'<div class="empty"><div class="empty-symbol" aria-hidden="true">藏</div><h2>你的诗页，等第一行收藏。</h2><p>在诗词旁点击“收藏此诗”，就能回到这里重读原文、译文与分析。</p><a class="outline-button" href="#library">去意象索引挑一首 →</a></div>')+'</div>';}
function aboutView(){const covered=DATA.imagery.filter(i=>countAvailable(i)>0).length;return '<div class="inner-main view-enter about-content">'+crumb([{text:'关于诗境'}])+'<div class="page-heading"><div><div class="eyebrow">ABOUT THIS FIELD GUIDE</div><h1>在景物里，读见人心。</h1><p>一个为古诗词研习而做的 AI SDL 项目。帮助学习者从具体词语出发，联系整首诗的语境，理解意象如何参与情感表达。</p></div></div><div class="about-stats"><div class="about-stat"><b>'+DATA.imagery.length+'</b><span>原稿意象索引</span></div><div class="about-stat"><b>'+DATA.poems.length+'</b><span>内置诗词与分析</span></div><div class="about-stat"><b>'+covered+'</b><span>已有匹配例诗的意象</span></div></div><section class="about-block"><h2>意象与意境，有什么区别？</h2><p><strong>意象</strong>是融入情感的具体形象，如落日、孤舟、菊；<strong>意境</strong>是这些景物与情感共同形成的整体氛围。同一个意象可以产生不同作用，不能只靠一个词就确定诗人的思想感情。</p><p>例如，《使至塞上》的落日参与构成壮阔的边塞画面；《送友人》的落日则在与浮云的对照中承载依依惜别。先读原句，再看全诗，是本工具采用的阅读顺序。</p></section><section class="about-block"><h2>两条阅读路径</h2><p>① 输入意象 → 选择该意象所属的意境 → 阅读诗词与分析。<br>② 首页选择意境 → 浏览对应意象 → 阅读这一语境下的例诗。</p><p>检索支持原稿内的同组别名，如“落日 / 夕阳”“东风（春风）”。“杜鹃”同时涉及花与鸟，会先让你选择具体条目。匹配会检查诗歌正文中的用词及已整理的意象标签，不以标题中的词凑数。</p></section><section class="about-block"><h2>内容来源与收录边界</h2><p>意象与四类归属来自用户提供的《sdl 1.docx》。原文提取到 '+DATA.rawEntryCount+' 条记录，合并相同标签的重复记录后保留 '+DATA.imagery.length+' 个索引条目；原稿中的宽泛词与生僻词也予以保留。四类是学习用的分类方式，不是排他的学术定论。</p><p>当前内置 '+DATA.poems.length+' 首古代公有领域作品。白话译文和教学分析由 AI 辅助整理，属于参考解读，可结合课堂讨论修订；不冒充古籍原注或唯一标准答案。原文出处及检索入口列在各首诗下方，打开外部资料需要联网。</p><p>当前 '+covered+' 个意象至少有一首相符例诗，但不代表每个意象的所有分类均已补齐。没有可靠匹配时明确显示“例诗待补充”；仅有一首时如实显示，不用同一首重复凑成两首。</p></section><section class="about-block"><h2>离线使用与个人记录</h2><p>搜索、分类、原诗、译文与分析均内置于本文件，不调用在线 AI 服务，不需要账号、API 密钥或安装依赖。可以直接双击 HTML 使用。</p><p>收藏仅写入本地浏览器。浏览器禁止本地存储时，收藏仍可在本次打开期间使用；页面会提示无法长期保存。复制研读笔记会优先使用浏览器剪贴板权限，失败时提供本地文本下载。</p></section><section class="about-block"><h2>关于 AI SDL 作业</h2><p>本网页是诗词学习工具本身。学校的行动方案、调研反馈、个人反思与展示材料需要小组根据真实过程另行完成；这里不预填成员身份、虚构访谈或测试反馈。</p></section></div>';}
function render(){currentReading=null;let parts;try{parts=decodeURIComponent(location.hash.slice(1)||'home').split('/');}catch{parts=['home'];}const [view,arg,category]=parts;const isHome=view==='home'||!['library','category','search','image','saved','about'].includes(view);document.body.classList.toggle('home',isHome);let html;if(isHome){html=homeView();document.title='诗境 · 古诗词意象研习';}else if(view==='library'){html=catalogView();document.title='意象索引 · 诗境';}else if(view==='category'&&M[arg]){html=catalogView(arg);document.title=M[arg].name+' · 诗境';}else if(view==='search'){html=searchView(parts.slice(1).join('/')||'');document.title='搜索意象 · 诗境';}else if(view==='image'&&byId[arg]){const image=byId[arg];html=category&&image.categories.includes(category)?readingView(image,category):chooseView(image);document.title=image.label+' · 诗境';}else if(view==='saved'){html=savedView();document.title='我的收藏 · 诗境';}else if(view==='about'){html=aboutView();document.title='关于诗境';}else{html='<div class="inner-main">'+crumb([{text:'未找到页面'}])+'<div class="empty"><h2>这条诗路暂未找到。</h2><p>页面地址中的意象或分类无效，请从完整索引继续。</p><a href="#library" class="outline-button">回到意象索引</a></div></div>';document.title='未找到页面 · 诗境';}main.innerHTML=html;updateCatalog();document.getElementById('footer-count').textContent=DATA.imagery.length+' 个意象 · '+DATA.poems.length+' 首诗词';window.scrollTo({top:0,behavior:'instant'});}
let toastTimer;function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),4000);}
function savePoem(id){if(!poemById[id])return;const isSaved=saved.has(id);if(isSaved)saved.delete(id);else saved.add(id);try{localStorage.setItem('shijing-saved-v1',JSON.stringify([...saved]));storageAvailable=true;}catch{storageAvailable=false;}document.querySelectorAll('[data-save]').forEach(button=>{const on=saved.has(button.dataset.save);button.setAttribute('aria-pressed',String(on));button.textContent=on?'已收藏 ✓':'收藏此诗 ＋';});toast(storageAvailable?(isSaved?'已取消收藏。':'已保存到当前浏览器的收藏。'):'浏览器无法保存收藏；本次打开期间仍可使用。');if(location.hash==='#saved')render();}
function readingText(){if(!currentReading)return '';const {image,mood}=currentReading;return [image.label+' · '+M[mood].name,'诗境 · 研读笔记',...matches(image,mood).slice(0,3).map(p=>['\n《'+p.title+'》 '+p.dynasty+' · '+p.author,...p.lines,'\n白话译文：'+p.translation,'意境：'+p.scene,'情感基调：'+p.tone,'思想感情：'+p.emotion,'表达手法：'+p.technique].join('\n')),'\n说明：AI 辅助整理的参考解读，请结合原文与课堂讨论。'].join('\n');}
function downloadText(text,name){const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
async function copyReading(){const text=readingText();if(!text)return;try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);toast('研读笔记已复制，包含原诗、译文与分析。');}catch{downloadText(text,'诗境-研读笔记.txt');toast('浏览器未允许复制，已改为下载研读笔记。');}}
document.addEventListener('submit',event=>{if(event.target.matches('[data-search]')){event.preventDefault();search(new FormData(event.target).get('query')||'');}});
document.addEventListener('input',event=>{if(event.target.id==='catalog-query'){catalogState.query=event.target.value.trim();catalogState.page=1;updateCatalog();}});
document.addEventListener('change',event=>{if(event.target.id==='only-ready'){catalogState.onlyReady=event.target.checked;catalogState.page=1;updateCatalog();}});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.hasAttribute('data-query'))search(button.dataset.query);else if(button.hasAttribute('data-choose'))imageRoute(button.dataset.image,button.dataset.choose);else if(button.hasAttribute('data-category'))route('#category/'+button.dataset.category);else if(button.hasAttribute('data-image'))imageRoute(button.dataset.image,button.dataset.openMood);else if(button.hasAttribute('data-filter')){const mood=button.dataset.filter;route(mood?'#category/'+mood:'#library');}else if(button.hasAttribute('data-page')){catalogState.page=Number(button.dataset.page);updateCatalog();document.getElementById('catalog-results').scrollIntoView({block:'start'});}else if(button.hasAttribute('data-reset-filters')){catalogState.query='';catalogState.onlyReady=false;catalogState.page=1;document.getElementById('catalog-query').value='';document.getElementById('only-ready').checked=false;updateCatalog();}else if(button.hasAttribute('data-save'))savePoem(button.dataset.save);else if(button.hasAttribute('data-copy-reading'))copyReading();else if(button.hasAttribute('data-print')){const details=[...document.querySelectorAll('.translation')],before=details.map(d=>d.open);details.forEach(d=>d.open=true);const restore=()=>{details.forEach((d,i)=>d.open=before[i]);window.removeEventListener('afterprint',restore);};window.addEventListener('afterprint',restore);window.print();}});
window.addEventListener('hashchange',()=>{render();main.focus({preventScroll:true});});
render();
</script>
</body>
</html>
