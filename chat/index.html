<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16181c">
<title data-i18n="chat.title">私线 · bobbycn.cc</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/mac-block.js" defer></script>
<!-- i18n 引擎与站点主题脚本：解析期同步执行（与主页/账号页同一套） -->
<script src="/i18n/i18n.js?v=20261027chat1"></script>
<link rel="stylesheet" href="/assets/chat.css?v=20261027chat1">
<link rel="stylesheet" href="/assets/atelier.css?v=20261021res1">
<!--
  站内私线（2026-10-27）
  ---------------------------------------------------------------------------
  只对两类人开放：站主本人，以及 role=subadmin 的受邀账号（当前只有 tina）。
  页面本身不藏 URL —— 谁都能打开，但打开后只看到「这条线不通」；真正的门在服务端
  （/api/chat/access 与每个读写端点的 resolveAccess），前端不承担权限判断。

  通信：上行全 REST（发消息/上传/已读/输入中），下行走 SSE（/api/chat/stream），
  EventSource 是浏览器原生的，不引入任何第三方脚本；SSE 断了会退回轮询。
-->
</head>
<body class="identity-edition chat-edition">
<header class="top site-header">
  <div class="toprow"><a class="name" href="/" aria-label="Bobbychina 首页" data-i18n-attr="aria-label:site.copy.25097b84dd1d">Bobbychina<span class="brand-dot">.</span></a>
  <nav class="tabs" aria-label="主导航" data-i18n-attr="aria-label:site.copy.9bae68040509"><a href="/" data-i18n="nav.projects">作品</a><a href="/games/" data-i18n="nav.games">游戏厅</a><a href="/posts/" data-i18n="nav.posts">文章</a><a href="/resources/" data-i18n="nav.resources">资源</a><a href="/#about" data-i18n="nav.about">关于</a></nav>
  <div class="header-actions"><span data-i18n-switch></span><span class="me" id="meBox" hidden><b id="meName"></b><button class="iconbtn" id="btnOut"><span data-i18n="games.acct.signOut">退出</span></button></span><a class="iconbtn" id="btnIn" href="/login/?next=/chat/"><span data-i18n="games.login.do">登录</span></a><button class="iconbtn" id="btnTheme" type="button" aria-label="切换深浅色" title="切换深浅色" data-i18n-attr="aria-label:site.copy.9970c97a4fb5;title:site.copy.9970c97a4fb5"><span data-i18n="site.copy.e2ff2b4b22e4">☾ 深色</span></button></div></div>
</header>

<main class="chat-shell" id="chatShell">
  <!-- 抬头：一枚印章 + 对方是谁 + 这条线的状态 -->
  <div class="chat-head">
    <div class="seal" aria-hidden="true"><span class="seal-mark" data-i18n="chat.head.seal">私线</span><span class="seal-no">01</span></div>
    <div class="who">
      <h1 id="peerName" data-i18n="chat.loading">正在接通…</h1>
      <p class="line-status">
        <span class="pulse" id="pulse" aria-hidden="true"></span>
        <span id="statusText" data-i18n="chat.status.connecting">正在接通…</span>
        <span class="rule" aria-hidden="true">/</span>
        <span id="meNameMini" class="me-mini"></span>
      </p>
    </div>
    <div class="head-side">
      <button class="ghost-link" id="btnReload" type="button" data-i18n="chat.reload">重新接通</button>
    </div>
  </div>

  <!-- 进不去时的说明（未登录 / 不是受邀账号 / 后端还没建 tina） -->
  <section class="gate" id="gate" hidden>
    <p class="gate-title" id="gateTitle" data-i18n="chat.error.notLogin">需要先登录站点账号</p>
    <p class="gate-text" id="gateText" data-i18n="chat.error.notLoginHint">登录后回来，这条线只给两个人开。</p>
    <div class="gate-actions">
      <a class="btn primary" id="gateLogin" href="/login/?next=/chat/" data-i18n="chat.login">去登录</a>
      <a class="btn ghost" href="/account/" data-i18n="chat.account">账号页</a>
    </div>
  </section>

  <!-- 消息流 -->
  <div class="thread-wrap" id="threadWrap">
    <button class="more" id="btnMore" type="button" hidden data-i18n="chat.more">加载更早的消息</button>
    <ol class="thread" id="thread" aria-live="polite" aria-relevant="additions"></ol>
    <div class="empty" id="empty" hidden>
      <p class="empty-title" data-i18n="chat.empty.title">还没有一滴墨。</p>
      <p class="empty-hint" data-i18n="chat.empty.hint">发第一句吧 —— 只有你们两个人看得到。</p>
    </div>
    <div class="typing" id="typing" hidden></div>
  </div>

  <!-- 待发送的附件 / 链接 -->
  <div class="pending-bar" id="pending" hidden>
    <div class="pending-chip" id="pendingChip"></div>
    <button class="pending-x" id="pendingX" type="button" aria-label="移除" data-i18n-attr="aria-label:chat.attach.remove">✕</button>
  </div>

  <!-- 链接输入行 -->
  <div class="link-row" id="linkRow" hidden>
    <label class="link-label" for="linkInput" data-i18n="chat.link.urlLabel">链接地址</label>
    <input id="linkInput" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…" data-i18n-attr="placeholder:chat.link.urlPlaceholder">
    <div class="link-actions">
      <button class="btn primary" id="linkSend" type="button" data-i18n="chat.link.confirm">发送链接</button>
      <button class="btn ghost" id="linkCancel" type="button" data-i18n="chat.link.cancel">取消</button>
    </div>
  </div>

  <!-- 表情面板 -->
  <div class="emoji-panel" id="emojiPanel" hidden>
    <div class="emoji-tabs" role="tablist" id="emojiTabs"></div>
    <div class="emoji-grid" id="emojiGrid" role="listbox" aria-label="表情" data-i18n-attr="aria-label:chat.tool.emoji"></div>
  </div>

  <!-- 输入区 -->
  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-tools">
      <button class="tool" id="btnEmoji" type="button" aria-label="表情" data-i18n-attr="aria-label:chat.tool.emoji" aria-expanded="false">☺</button>
      <button class="tool" id="btnFile" type="button" aria-label="文件" data-i18n-attr="aria-label:chat.tool.file">＋</button>
      <button class="tool" id="btnLink" type="button" aria-label="链接" data-i18n-attr="aria-label:chat.tool.link">↗</button>
      <span class="tool-note" data-i18n="chat.tool.hint">Enter 发送 · Shift+Enter 换行</span>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" maxlength="4000" placeholder="写点什么…" aria-label="消息内容" data-i18n-attr="placeholder:chat.placeholder;aria-label:chat.placeholder"></textarea>
      <button class="send" id="btnSend" type="submit"><span data-i18n="chat.send">发送</span></button>
    </div>
    <div class="composer-msg" id="composerMsg" role="status"></div>
  </form>
  <input type="file" id="fileInput" hidden>
</main>

<script src="/assets/site.js?v=20261027chat1" defer></script>
<script src="/assets/chat.js?v=20261027chat1" defer></script>
</body>
</html>
