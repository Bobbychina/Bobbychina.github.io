# 静态站自动上线：main 有新提交 → 同步到东京服务器 /var/www/portal
#
# 为什么需要它：主站 bobbycn.cc 是自建服务器（不是 GitHub Pages），push 到本仓库
# 原本不会影响线上，只能靠站长在本机手工 scp/ssh。这个工作流把那段手工步骤固化成一条链路。
#
# 保守设计（都是故意的，别随手改成"更简洁"的写法）：
#   1. 目标目录 /var/www/portal 里混着**不由本仓库管理**的内容（admin/ 来自写作台、
#      posts/ media/ 实际 alias 到 /opt/stockgame/blog-dist、.deny/ 是 nginx 的 403 页）。
#      打 tar 包时要排除这些路径 —— 少一处排除就会把线上内容覆盖掉。
#   2. 不使用 rsync --delete：只覆盖、不删除。代价是仓库里删掉的文件会留在线上，
#      但换来"任何一次部署都不可能删掉服务器上的东西"。要清理由站长手工处理。
#   3. 部署前在服务器 /opt/stockgame/snapshots 留一份上一次的 tar 包，
#      回滚就是把它解开覆盖回去（见 tools/rollback-portal.sh）。
#   4. **推 main 即上线，没有审批环节**（2026-10-07 站长决定）。
#      原先挂在 production environment 上要求点 Approve，站长认为那道手动闸门反直觉：
#      他给的是"能直接推 main"的权限，而且真正拦住事故的是上面第 2 条（不删除）
#      与第 3 条（有快照可回滚），不是点一下批准。
#      若哪天真要恢复审批：给 deploy 作业加回 environment: production 即可，
#      仓库里那个 production 环境还留着（审批人配置也在）。

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发：用于重跑某次部署

# 串行部署：两个人同时推 main 时不会交错覆盖。
#
# cancel-in-progress 从 false 改成 true（2026-10-07），原因是它救过一次死锁：
# 去掉 environment 审批后，仍在等批准的旧 run 会把并发组一直占着 ——
# 新 run 全部停在 pending，而取消 API 对 waiting 状态的 run 无效（返回 500）。
# 设成 true 后，新来的 run 会自动取消前面还在排队的 run。
#
# 取舍：正常情况下它会让"部署到一半时又推一版"变成取消重跑。这里可接受，因为
# 发布本身是幂等的（tar 覆盖 + 快照），历史版本照旧可从 /opt/stockgame/snapshots 回滚。
concurrency:
  group: deploy-portal
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建产物包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # i18n 自检：词典键与页面实际用键不对齐就退出 1，挡住"改了页面漏改词条"
      - name: i18n 自检
        run: node tools/i18n-check.mjs

      # 存在性闸门：这些文件曾被漏掉 git add（只活在站长本机与服务器上）。
      # 一旦从仓库里消失，部署就会把它们从线上抹掉 —— 这里宁可拒绝部署。
      - name: 必需文件存在性检查
        run: |
          set -e
          missing=0
          for f in index.html favicon.svg favicon.ico apple-touch-icon.png \
                   icon-192.png icon-512.png assets/site.css assets/site.js \
                   assets/blog.js mail/index.html i18n/i18n.js; do
            if [ ! -f "$f" ]; then echo "::error::缺少必需文件：$f"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "拒绝部署：仓库缺少线上正在使用的文件"; exit 1; }
          echo "必需文件齐全"

      - name: 打包站点
        run: |
          # .staging/ 与 .deploy-key/ 都是本机工作目录（含测试环境密钥、Basic 口令、部署私钥），
          # 绝不能进产物 —— 产物会解到 /var/www/portal，那是公网可取的目录。
          # partner-kit*.zip / partner-kit/ 同理：给合作伙伴的工具包里含服务器私钥与所有口令，
          # 已在 .gitignore 里堵过一道，这里再排一道（防 git add -f 之类的意外）。
          tar -czf /tmp/portal.tar.gz \
            --exclude=./.git --exclude=./.github --exclude=./.deploy-key \
            --exclude=./.staging --exclude=./.partner-kit \
            --exclude=./partner-kit --exclude=./partner-kit.zip \
            --exclude='./partner-kit*.zip' \
            --exclude=./tools --exclude=./functions \
            --exclude=./.wrangler --exclude=./.probe --exclude=./node_modules \
            .
          ls -lh /tmp/portal.tar.gz
          echo "--- 自检：产物里不得出现敏感文件名 ---"
          if tar -tzf /tmp/portal.tar.gz | grep -Ei 'partner-kit|id_ed25519|relay-token|prod\.env|/\.env$|^\./\.env'; then
            echo "::error::产物里出现敏感文件，拒绝部署"; exit 1
          fi
          echo "自检通过：无敏感文件"

      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: /tmp/portal.tar.gz
          retention-days: 14

  deploy:
    name: 同步到东京服务器
    needs: build
    runs-on: ubuntu-latest
    # 这里原先挂着 environment: production（Required reviewers）做审批闸门。
    # 2026-10-07 站长决定去掉：推 main 即上线。要恢复审批就取消下面几行的注释，
    # 并保留上面 environment 的 name/url（环境与审批人配置都还在仓库里）。
    # environment:
    #   name: production
    #   url: https://bobbycn.cc/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: /tmp

      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # 私钥经环境变量传入，不落进仓库、也不会回显到日志
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 只信任扫描到的这把主机公钥；ssh-keyscan 失败即中止（避免 TOFU 盲连）
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: 上传并发布
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            /tmp/portal.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/portal.tar.gz"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # ① 留一份上一次线上内容的快照（回滚用）
          sudo install -d -o ubuntu -g ubuntu /opt/stockgame/snapshots
          if [ -f /tmp/portal-last.tar.gz ]; then
            sudo cp /tmp/portal-last.tar.gz "/opt/stockgame/snapshots/portal-$(date +%Y%m%d-%H%M%S).tar.gz"
            sudo find /opt/stockgame/snapshots -name 'portal-*.tar.gz' -mtime +30 -delete
          fi
          cp /tmp/portal.tar.gz /tmp/portal-last.tar.gz
          # ② 覆盖发布（不删除服务器上任何东西）
          sudo tar -xzf /tmp/portal.tar.gz -C /var/www/portal
          sudo chown -R www-data:www-data /var/www/portal
          # ③ 收回权限：tar 包里可能带着 777/755 之外的模式
          sudo find /var/www/portal -type d -exec chmod 755 {} +
          sudo find /var/www/portal -type f -exec chmod 644 {} +
          echo "DEPLOYED files=$(sudo find /var/www/portal -type f | wc -l)"
          REMOTE

      # 部署后冒烟：这些 URL 任意一个不是 200 就判失败，避免"推成功了但站点是坏的"
      - name: 线上冒烟
        run: |
          set -euo pipefail
          for u in https://bobbycn.cc/ https://bobbycn.cc/assets/site.css \
                   https://bobbycn.cc/games/ https://bobbycn.cc/login/; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$u -> $code"
            [ "$code" = "200" ] || exit 1
          done
