<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>注册 · bobbycn.cc</title>
<link rel="stylesheet" href="/assets/site.css?v=20260928h">
<script src="/assets/site.js?v=20260928h" defer></script>
<style>
  .card{max-width:420px;margin:9vh auto;padding:0 22px}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  label{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em;margin:14px 0 5px}
  input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  input:focus{outline:none;border-color:var(--seal)}
  button{font:inherit;font-size:14px;width:100%;margin-top:20px;padding:10px;border-radius:9px;cursor:pointer;
         background:transparent;color:var(--ink);border:1px solid var(--seal)}
  button:hover{background:var(--seal);color:#1A0F0C}
  button[disabled]{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;color:var(--seal);min-height:20px;line-height:1.8}
  .msg.ok{color:var(--soft)}
  .foot{margin-top:22px;color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
  .foot a{color:inherit;border-bottom:1px solid transparent}
  .foot a:hover{color:var(--seal);border-bottom-color:var(--seal)}
  .hintbox{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-left:2px solid var(--seal);border-radius:8px;color:var(--dim);font-size:12.5px;line-height:1.85}
</style>
</head>
<body>
<div class="wrap" style="max-width:820px">
  <header class="top" style="margin:0 -24px 8px;padding:8px 24px 0">
    <div class="toprow">
      <a class="name" href="/">Bobby<i>.</i></a>
      <span class="spacer"></span>
      <span class="me" id="meBox" hidden><b id="meName"></b><button class="iconbtn" id="btnOut">退出</button></span>
      <a class="iconbtn" id="btnIn" href="/login/" style="border-bottom:0">登录</a>
      <button class="iconbtn" id="btnTheme">☾ 深色</button>
    </div>
    <nav class="tabs">
      <a href="/">在做的东西</a>
      <a href="/posts/">写下来的</a>
      <a href="/games/">游戏厅</a>
      <a href="/#about">关于</a>
    </nav>
  </header>
</div>

<div class="card">
  <h1>注册</h1>
  <p class="sub">一个账号走全站：博客、游戏厅、模拟炒股、以后的任何东西。</p>

  <label for="em">邮箱</label>
  <input id="em" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com">
  <label for="pw">口令（至少 8 位）</label>
  <input id="pw" type="password" autocomplete="new-password">
  <label for="pw2">再输一次</label>
  <input id="pw2" type="password" autocomplete="new-password">

  <button id="btn">注册</button>
  <div class="msg" id="msg"></div>

  <div class="hintbox" id="mailhint" hidden>
    邮件已经发出（或写进了服务端日志）。**当前尚未接入发信服务**，如果收不到邮件，跟我说一声，我从服务器日志里把验证链接取给你。
  </div>

  <div class="foot">
    <a href="/login/">已有账号？登录</a>
    <a href="/">← 回首页</a>
  </div>
</div>

<script>
(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('btn');
  function go(){
    var em=document.getElementById('em').value.trim();
    var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
    if(!em || em.indexOf('@')<0){ msg.textContent='请填一个像样的邮箱'; return; }
    if(pw.length<8){ msg.textContent='口令至少 8 位'; return; }
    if(pw!==pw2){ msg.textContent='两次口令不一致'; return; }
    btn.disabled=true; msg.className='msg'; msg.textContent='提交中…';
    fetch('/api/auth/identity/register',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json'},body:JSON.stringify({email:em,password:pw})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,status:r.status,d:d}; }); })
      .then(function(res){
        if(res.ok){
          msg.className='msg ok';
          msg.textContent='已受理。去邮箱点验证链接即可完成注册（30 分钟内有效）。';
          document.getElementById('mailhint').hidden=false;
          btn.textContent='已发送';
          return;
        }
        msg.className='msg';
        msg.textContent=(res.d && (res.d.message||res.d.error)) || ('注册失败（'+res.status+'）');
        btn.disabled=false;
      })
      .catch(function(){ msg.textContent='网络错误，稍后再试'; btn.disabled=false; });
  }
  btn.addEventListener('click',go);
  document.getElementById('pw2').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
})();
</script>
</body>
</html>
