<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · bobbycn.cc</title>
<script src="/mac-block.js" defer></script>
<!--
  全站登录页（2026-09-28）
  会话是**域级 Cookie**（Domain=.bobbycn.cc，HttpOnly/Secure/SameSite=Lax）：
  在 bobbycn.cc 登录一次，主页 / 博客 / 游戏厅 / game.bobbycn.cc 这些子域共用同一份登录态。
  提交到统一身份模块 POST /api/auth/identity/login（服务器侧 argon2id + 双维度限流）。
-->
<style>
  :root{
    --serif:Georgia,"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --seal:#D4553F;
  }
  html[data-theme="dark"]{--bg:#121110;--ink:#EAE5DD;--dim:#948B80;--soft:#BDB4A8;--line:#2A2723;--panel:#191715;--glow1:#211D19}
  html[data-theme="light"]{--bg:#FAF7F0;--ink:#1E1B18;--dim:#8A8177;--soft:#4A443C;--line:#E7E1D6;--panel:#FFFDF8;--glow1:#FFFDF8}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.9;color:var(--ink);
    background:radial-gradient(120% 80% at 12% -10%,var(--glow1) 0%,rgba(0,0,0,0) 60%),var(--bg);transition:background .25s,color .25s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
  .card{position:relative;z-index:1;max-width:400px;margin:11vh auto;padding:0 22px}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 26px}
  label{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em;margin:16px 0 5px}
  input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  input:focus{outline:none;border-color:var(--seal)}
  button{font:inherit;font-size:14px;width:100%;margin-top:22px;padding:10px;border-radius:9px;cursor:pointer;
    background:transparent;color:var(--ink);border:1px solid var(--seal)}
  button:hover{background:var(--seal);color:#1A0F0C;border-color:var(--seal)}
  button[disabled]{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;color:var(--seal);min-height:20px}
  .foot{margin-top:26px;color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
  .foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .foot a:hover{color:var(--seal);border-bottom-color:var(--seal)}
  .top{position:absolute;top:18px;right:22px;z-index:2}
  .iconbtn{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;width:auto;margin:0}
</style>
</head>
<body>
<button class="iconbtn top" id="btnTheme">☾ 深色</button>
<div class="card">
  <h1>登录</h1>
  <p class="sub">这一份登录态覆盖整个 bobbycn.cc（含 game. 子域）。</p>

  <label for="id">邮箱或用户名</label>
  <input id="id" autocomplete="username" autocapitalize="off" spellcheck="false">
  <label for="pw">口令</label>
  <input id="pw" type="password" autocomplete="current-password">

  <button id="btn">登录</button>
  <div class="msg" id="msg"></div>

  <div class="foot">
    <a href="/">← 回首页</a>
    <a href="/register/">注册新账号</a>
    <a href="/admin/">写作台</a>
    <a href="/posts/">博客</a>
  </div>
</div>

<script>
(function(){
  var KEY='site-theme', saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  var theme=(saved==='light'||saved==='dark')?saved:'dark';
  function apply(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('btnTheme').textContent=t==='dark'?'☾ 深色':'☀ 浅色';}
  apply(theme);
  document.getElementById('btnTheme').addEventListener('click',function(){
    theme=theme==='dark'?'light':'dark'; try{localStorage.setItem(KEY,theme);}catch(e){}; apply(theme);
  });
})();

(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('btn');
  var next=new URLSearchParams(location.search).get('next')||'/';
  function go(){
    var id=document.getElementById('id').value.trim(), pw=document.getElementById('pw').value;
    if(!id||!pw){ msg.textContent='邮箱/用户名和口令都要填'; return; }
    btn.disabled=true; msg.textContent='登录中…';
    var body = id.indexOf('@')>=0 ? {email:id,password:pw} : {username:id,password:pw};
    fetch('/api/auth/identity/login',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,status:r.status,d:d}; }); })
      .then(function(res){
        if(res.ok){ msg.textContent='好了，正在跳转…'; location.href=next; return; }
        msg.textContent = (res.d && (res.d.message||res.d.error)) || ('登录失败（'+res.status+'）');
        btn.disabled=false;
      })
      .catch(function(){ msg.textContent='网络错误，稍后再试'; btn.disabled=false; });
  }
  btn.addEventListener('click',go);
  document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
})();
</script>
</body>
</html>
