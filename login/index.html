<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title data-i18n="site.copy.da4b6462c7b6">登录 · bobbycn.cc</title>

<!--
  全站登录页（2026-09-28）
  会话是**域级 Cookie**（Domain=.bobbycn.cc，HttpOnly/Secure/SameSite=Lax）：
  在 bobbycn.cc 登录一次，主页 / 博客 / 游戏厅 / game.bobbycn.cc 这些子域共用同一份登录态。
  提交到统一身份模块 POST /api/auth/identity/login（服务器侧 argon2id + 双维度限流）。
-->
<style>
  :root{
    --serif:Georgia,"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --seal:#D4553F;
  }
  html[data-theme="dark"]{--bg:#121110;--ink:#EAE5DD;--dim:#948B80;--soft:#BDB4A8;--line:#2A2723;--panel:#191715;--glow1:#211D19}
  html[data-theme="light"]{--bg:#FAF7F0;--ink:#1E1B18;--dim:#8A8177;--soft:#4A443C;--line:#E7E1D6;--panel:#FFFDF8;--glow1:#FFFDF8}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.9;color:var(--ink);
    background:radial-gradient(120% 80% at 12% -10%,var(--glow1) 0%,rgba(0,0,0,0) 60%),var(--bg);transition:background .25s,color .25s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
  .card{position:relative;z-index:1;max-width:400px;margin:11vh auto;padding:0 22px}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 26px}
  /* 加 .card 前缀的原因同 register：别让表单规则溢出到页头/主题按钮上 */
  .card label{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em;margin:16px 0 5px}
  .card input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .card input:focus{outline:none;border-color:var(--seal)}
  .card button{font:inherit;font-size:14px;width:100%;margin-top:22px;padding:10px;border-radius:9px;cursor:pointer;
    background:transparent;color:var(--ink);border:1px solid var(--seal)}
  .card button:hover{background:var(--seal);color:#1A0F0C;border-color:var(--seal)}
  .card button[disabled]{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;color:var(--seal);min-height:20px}
  .foot{margin-top:26px;color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
  .foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
  .foot a:hover{color:var(--seal);border-bottom-color:var(--seal)}
  .top{position:absolute;top:18px;right:22px;z-index:2}
  .iconbtn{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;width:auto;margin:0}
</style>
<link rel="stylesheet" href="/assets/atelier.css?v=20261021res1">
</head>
<body class="identity-edition">
<header class="top site-header"><span data-i18n-switch></span>
  <div class="toprow"><a class="name" href="/" aria-label="Bobbychina 首页" data-i18n-attr="aria-label:site.copy.25097b84dd1d">Bobbychina<span class="brand-dot">.</span></a>
  <nav class="tabs" aria-label="主导航" data-i18n-attr="aria-label:site.copy.9bae68040509"><a href="/" data-i18n="nav.projects">作品</a><a href="/games/" data-i18n="nav.games">游戏厅</a><a href="/posts/" data-i18n="nav.posts">文章</a><a href="/resources/" data-i18n="nav.resources">资源</a><a href="/#about" data-i18n="nav.about">关于</a></nav>
  <div class="header-actions"><button class="iconbtn" id="btnTheme" type="button" aria-label="切换深浅色" title="切换深浅色" data-i18n-attr="aria-label:site.copy.9970c97a4fb5;title:site.copy.9970c97a4fb5"><span data-i18n="site.copy.e2ff2b4b22e4">☾ 深色</span></button></div></div>
 </header>
<main class="identity-layout">
<div class="card">
  <h1><span data-i18n="games.login.do">登录</span></h1>
  <p class="sub"><span data-i18n="site.copy.ef380407db53">这一份登录态覆盖整个 bobbycn.cc（含 game. 子域）。</span></p>

  <label for="id"><span data-i18n="site.copy.1ef7b40a9c43">邮箱或用户名</span></label>
  <input id="id" autocomplete="username" autocapitalize="off" spellcheck="false">
  <label for="pw"><span data-i18n="site.copy.f265a7b34089">口令</span></label>
  <input id="pw" type="password" autocomplete="current-password">

  <button id="btn"><span data-i18n="games.login.do">登录</span></button>
  <div class="msg" id="msg"></div>

  <!-- 忘记口令：就地展开，走 /api/auth/identity/password/reset-request（不泄露邮箱是否存在） -->
  <div style="margin-top:14px">
    <a href="#" id="forgot" style="font-size:12.5px;color:var(--dim);border-bottom:1px solid transparent"><span data-i18n="site.copy.b8441756fa23">忘记口令？</span></a>
  </div>
  <div id="fbox" hidden style="margin-top:10px">
    <input id="femail" type="email" placeholder="注册时用的邮箱" autocomplete="email" data-i18n-attr="placeholder:site.copy.e4e644c97ca5">
    <!-- 同一张 widget：找回口令这条路同样要挡机器人（action 与注册区分开，服务端会核对） -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFG_gA9qpBv-0gsz" data-action="password-reset" data-theme="dark" data-size="flexible" data-language="auto" style="margin-top:12px"></div>
    <button id="fbtn" style="margin-top:10px"><span data-i18n="site.copy.d4e97cffe3ba">发重置链接</span></button>
    <div class="msg" id="fmsg"></div>
  </div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

  <div class="foot">
    <a href="/"><span data-i18n="site.copy.91ed48734ad0">← 回首页</span></a>
    <a href="/register/"><span data-i18n="site.copy.e6c3b53f19a5">注册新账号</span></a>
    <a href="/admin/"><span data-i18n="account.admin">写作台</span></a>
    <a href="/posts/"><span data-i18n="site.copy.7855e5e9727e">博客</span></a>
  </div>
</div>
</main>

<script>
(function(){
  var KEY='site-theme', saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  var theme=(saved==='light'||saved==='dark')?saved:'dark';
  function apply(t){document.documentElement.setAttribute('data-theme',t);I18N.bind(document.getElementById('btnTheme'), "textContent", function(){return t==='dark'?I18N.t("site.copy.e2ff2b4b22e4"):I18N.t("site.copy.71bca47baab4");});}
  apply(theme);
  document.getElementById('btnTheme').addEventListener('click',function(){
    theme=theme==='dark'?'light':'dark'; try{localStorage.setItem(KEY,theme);}catch(e){}; apply(theme);
  });
})();

(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('btn');
  /* next：只允许**本站相对路径**。没有这道校验的话，/login/?next=https://evil.com 就成了
     一个挂在可信域名下的开放重定向（钓鱼最爱的跳板）。授权流程回跳（/api/auth/identity/oauth/...）
     与站内页面都在这张白名单里。 */
  function safeNext(raw){
    var v=String(raw||'');
    if(!v || v.charAt(0)!=='/' || v.indexOf('//')===0 || v.indexOf('\\')>=0) return '/';
    var ok=['/api/auth/identity/oauth/','/games/','/admin/','/secret/','/account/','/posts/','/'];
    for(var i=0;i<ok.length;i++){ if(v.indexOf(ok[i])===0) return v; }
    return '/';
  }
  var next=safeNext(new URLSearchParams(location.search).get('next'));
  function go(){
    var id=document.getElementById('id').value.trim(), pw=document.getElementById('pw').value;
    if(!id||!pw){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.cafd6e226343");}); return; }
    btn.disabled=true; I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.3f06ed8f8c38");});
    var body = id.indexOf('@')>=0 ? {email:id,password:pw} : {username:id,password:pw};
    fetch('/api/auth/identity/login',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json','Accept-Language':I18N.current()},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,status:r.status,d:d}; }); })
      .then(function(res){
        if(res.ok){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.2fe5b668d7ee");}); location.href=next; return; }
        I18N.bind(msg, "textContent", function(){return I18N.error(res.d,res.status) || (I18N.t("site.copy.46f6229f9c22")+res.status+'）');});
        btn.disabled=false;
      })
      .catch(function(){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.a47e6b8881b7");}); btn.disabled=false; });
  }
  btn.addEventListener('click',go);
  document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  /* 从游戏授权页被送过来的：把"你正在授权某某应用"说清楚，别让人以为莫名其妙被踢到登录页 */
  if(new URLSearchParams(location.search).get('next')){
    var app=(new URLSearchParams(location.search).get('next')||'').match(/client_id=([A-Za-z0-9._-]+)/);
    I18N.bind(document.querySelector('.sub'), 'textContent', function(){return app ? I18N.t('login.authorize',{app:app[1]}) : I18N.t('login.authorizeGeneral');});
  }
})();

/* 忘记口令：就地问邮箱 → reset-request。后端对"邮箱不存在"也返回同样的话，避免枚举。
   Turnstile 用同一张 widget（action=password-reset），令牌一次性：失败后必须 reset 才能重试。 */
(function(){
  var link=document.getElementById('forgot'), box=document.getElementById('fbox');
  var fmsg=document.getElementById('fmsg'), fbtn=document.getElementById('fbtn');
  var tsWidget=null;
  function renderChallenge(){
    if(!window.turnstile) return;
    if(tsWidget!==null) window.turnstile.remove(tsWidget);
    tsWidget=window.turnstile.render('.cf-turnstile', { sitekey:'0x4AAAAAAFG_gA9qpBv-0gsz', action:'password-reset', theme:'dark', language: I18N.turnstileLanguage() });
  }
  window.addEventListener('load',renderChallenge);
  I18N.onChange(renderChallenge);
  function tsToken(){ try { return (tsWidget!==null&&window.turnstile)?(window.turnstile.getResponse(tsWidget)||''):''; } catch(e){ return ''; } }
  link.addEventListener('click',function(e){
    e.preventDefault(); box.hidden=!box.hidden;
    if(!box.hidden) document.getElementById('femail').focus();
  });
  fbtn.addEventListener('click',function(){
    var em=document.getElementById('femail').value.trim();
    if(!em||em.indexOf('@')<0){ I18N.bind(fmsg, "textContent", function(){return I18N.t("site.copy.b374dd2809e9");}); return; }
    fbtn.disabled=true; I18N.bind(fmsg, "textContent", function(){return I18N.t("site.copy.364970d8168c");});
    var payload={email:em}; var t=tsToken(); if(t) payload.cfToken=t;
    fetch('/api/auth/identity/password/reset-request',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json','Accept-Language':I18N.current()},body:JSON.stringify(payload)})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,status:r.status,d:d}; }); })
      .then(function(res){
        I18N.bind(fmsg, "textContent", function(){return res.ok
          ? I18N.t("site.copy.0a024a6bae66")
          : (I18N.error(res.d,res.status)||(I18N.t("site.copy.b93f4969a242")+res.status+'）'));});
        fbtn.disabled=false;
        try { if (tsWidget!==null&&window.turnstile) window.turnstile.reset(tsWidget); } catch(e){}
      })
      .catch(function(){ I18N.bind(fmsg, "textContent", function(){return I18N.t("site.copy.a47e6b8881b7");}); fbtn.disabled=false; });
  });
})();
</script>
</body>
</html>
