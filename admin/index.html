<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>写作台 · bobbycn.cc</title>
<!--
  站内写作台（/admin/）：登录后直接在站上写文章，不用碰 GitHub。
  设计取舍（2026-09-28）：会上原定用现成 git-based CMS（Pages CMS）；站主要求改为站内直写，
  因此这里自研一个极简编辑器，补偿控制：
    · 登录走 /api/auth/login（先复用现有 bcrypt+JWT 管理员账号；identity 模块上线后同一路径自动切换，页面不用改）
    · 只接受 role=ADMIN（后端守卫，前端隐藏不代表权限）；所有写操作都过 JwtAuthGuard
    · 草稿/发布分离：只有点「发布」才会重新渲染静态页
    · 页面零第三方脚本、零外联（避免把 token 暴露给任何 CDN）
  发布链路：保存 → 后端写 Markdown + 重新构建 → 产物落 /opt/stockgame/blog-dist → nginx 直出
-->
<style>
  :root{--bg:#0b0d10;--panel:#10151a;--fg:#e6e6e3;--dim:#8b9198;--line:#1e2227;--ok:#5bd67a;--warn:#e0b44a;--accent:#7fd1ff;--bad:#ff8f8f;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
  header .b{font-weight:600}header .dim{color:var(--dim);font-size:12.5px}
  header .sp{flex:1}
  button{font-family:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#151a20;color:var(--fg);cursor:pointer}
  button:hover{border-color:#2a323b}
  button.primary{background:#14351f;border-color:#1f5c33;color:#c8f5d5}
  button.danger{background:#2a1416;border-color:#5c2026;color:#ffd7d7}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,textarea{font-family:inherit;font-size:13.5px;background:#0d1116;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
  textarea{min-height:340px;line-height:1.7;resize:vertical;white-space:pre-wrap}
  .wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 49px)}
  .side{border-right:1px solid var(--line);padding:12px;overflow:auto}
  .main{padding:16px 18px;overflow:auto}
  .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  label{display:block;color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
  .item{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
  .item:hover{border-color:#2a323b}
  .item.on{border-color:#2c6b8f;background:#0e1a22}
  .item .t{font-size:13px}
  .item .m{color:var(--dim);font-size:11.5px;margin-top:3px;display:flex;gap:8px}
  .tag{padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);font-size:11px}
  .tag.pub{color:#c8f5d5;border-color:#1f5c33;background:#14351f}
  .toast{position:fixed;right:16px;bottom:16px;max-width:420px;background:#11202b;border:1px solid #26414f;border-radius:8px;padding:10px 12px;font-size:13px;display:none;white-space:pre-wrap}
  .toast.err{background:#2a1416;border-color:#5c2026}
  .center{max-width:420px;margin:12vh auto;padding:0 18px}
  .hint{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.7}
  .prev{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--panel);max-height:60vh;overflow:auto}
  .prev h1{font-size:22px;margin:0 0 8px}.prev h2{font-size:18px;margin:22px 0 8px}.prev h3{font-size:16px;margin:18px 0 6px}
  .prev pre{background:#0d1116;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto}
  .prev code{background:#141a20;padding:1px 4px;border-radius:4px}
  .prev blockquote{border-left:2px solid var(--line);margin:12px 0;padding-left:12px;color:var(--dim)}
  .prev img{max-width:100%}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>

<header>
  <span class="b">写作台</span>
  <span class="dim">bobbycn.cc/admin</span>
  <span class="sp"></span>
  <span class="dim" id="who"></span>
  <button id="btnNew">＋ 新文章</button>
  <button id="btnLogout" style="display:none">退出</button>
</header>

<!-- ① 登录 -->
<div id="loginView" class="center">
  <h2 style="margin:0 0 14px">登录后开始写</h2>
  <div class="row"><div>
    <label>账号</label><input id="u" autocomplete="username" placeholder="admin">
  </div></div>
  <div class="row"><div>
    <label>口令</label><input id="p" type="password" autocomplete="current-password">
  </div></div>
  <div class="row"><div>
    <button class="primary" id="btnLogin" style="width:100%">登录</button>
  </div></div>
  <p class="hint">登录走 <code>/api/auth/login</code>（当前是 bcrypt+JWT 管理员账号；<b>identity 模块上线后同一路径自动切换</b>，此页无需改动）。<br>
  口令只在本机与服务端之间传输，页面不引任何第三方脚本。</p>
</div>

<!-- ② 编辑器 -->
<div id="editView" class="wrap" style="display:none">
  <aside class="side">
    <div style="color:var(--dim);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">文章</div>
    <div id="list"></div>
    <p class="hint" id="listHint">还没有文章，点右上角「＋ 新文章」。</p>
  </aside>

  <main class="main">
    <div class="row">
      <div style="flex:2"><label>标题</label><input id="fTitle" placeholder="标题"></div>
      <div><label>短链 slug</label><input id="fSlug" placeholder="my-first-post"></div>
    </div>
    <div class="row">
      <div><label>日期</label><input id="fDate" type="date"></div>
      <div><label>标签（逗号分隔）</label><input id="fTags" placeholder="自建, nginx"></div>
      <div><label>草稿</label><select id="fDraft" style="width:100%;padding:7px 9px;background:#0d1116;color:var(--fg);border:1px solid var(--line);border-radius:6px"><option value="1">草稿（不发布）</option><option value="0">已发布</option></select></div>
    </div>
    <div class="row"><div><label>摘要（列表页与 RSS 用）</label><input id="fSummary"></div></div>

    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto"><button id="btnSave" class="primary">保存</button></div>
      <div style="flex:0 0 auto"><button id="btnDel" class="danger">删除</button></div>
      <div style="flex:0 0 auto"><button id="btnPreview">预览 / 编辑</button></div>
      <div style="flex:1;text-align:right;color:var(--dim);font-size:12px" id="meta">Ctrl+S 保存</div>
    </div>

    <div id="editPane"><label>正文（Markdown）</label><textarea id="fBody" spellcheck="false"></textarea></div>
    <div id="prevPane" style="display:none" class="prev"></div>
    <p class="hint" id="pubHint" style="display:none"></p>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 工具 ── */
const $ = (id) => document.getElementById(id);
let TOKEN = sessionStorage.getItem('admin_token') || '';
let ME = null, CURRENT = null, LIST = [];

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, err ? 9000 : 3500);
}
async function api(path, opt) {
  const o = Object.assign({ headers: {} }, opt || {});
  o.headers['content-type'] = o.headers['content-type'] || 'application/json';
  if (TOKEN) o.headers.authorization = 'Bearer ' + TOKEN;
  const r = await fetch(path, o);
  const txt = await r.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = { raw: txt }; }
  if (r.status === 401 || r.status === 403) { logout(); throw new Error('登录已失效，请重新登录'); }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + r.status));
  return data;
}

/* ── 极简 Markdown 预览（与服务器端 build.mjs 同一子集，避免两边渲染结果不一致）── */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
}
function md2html(md) {
  const L = String(md || '').replace(/\r\n?/g, '\n').split('\n'), out = [];
  let i = 0, list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const lang = l.slice(3).trim(), buf = []; i++; while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++; close(); out.push('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : '') + '>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    if (/^\s*$/.test(l)) { close(); i++; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { close(); out.push('<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
    if (/^(---|\*\*\*|___)\s*$/.test(l)) { close(); out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { const buf = []; while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, '')); close(); out.push('<blockquote>' + md2html(buf.join('\n')) + '</blockquote>'); continue; }
    const ul = l.match(/^\s*[-*+]\s+(.*)$/), ol = l.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) { const want = ul ? 'ul' : 'ol'; if (list !== want) { close(); out.push('<' + want + '>'); list = want; } out.push('<li>' + inlineMd((ul || ol)[1]) + '</li>'); i++; continue; }
    const p = [l]; i++;
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|```|>|\s*[-*+]\s|\s*\d+\.\s)/.test(L[i])) p.push(L[i++]);
    close(); out.push('<p>' + inlineMd(p.join(' ')) + '</p>');
  }
  close(); return out.join('\n');
}

/* ── 登录/登出 ── */
function showLogin() { $('loginView').style.display = ''; $('editView').style.display = 'none'; $('who').textContent = ''; $('btnLogout').style.display = 'none'; }
function logout() { TOKEN = ''; ME = null; sessionStorage.removeItem('admin_token'); showLogin(); }
async function login() {
  const username = $('u').value.trim(), password = $('p').value;
  if (!username || !password) return toast('账号和口令都要填', true);
  $('btnLogin').disabled = true;
  try {
    const d = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    TOKEN = d.token || d.access_token;
    if (!TOKEN) throw new Error('登录响应里没有 token');
    ME = d.user || {};
    sessionStorage.setItem('admin_token', TOKEN);
    sessionStorage.setItem('admin_user', JSON.stringify(ME));
    await enter();
  } catch (e) { toast('登录失败：' + e.message, true); }
  finally { $('btnLogin').disabled = false; }
}
async function enter() {
  $('loginView').style.display = 'none'; $('editView').style.display = ''; $('btnLogout').style.display = '';
  $('who').textContent = (ME && ME.username ? ME.username : '') + (ME && ME.role ? ' · ' + ME.role : '');
  await loadList();
  if (!CURRENT) newPost();
}
function newPost() {
  CURRENT = { slug: '', title: '', date: new Date().toISOString().slice(0, 10), tags: '', summary: '', body: '', draft: true };
  fill(CURRENT); renderList(); markMeta('未保存');
}
function fill(p) {
  $('fTitle').value = p.title || ''; $('fSlug').value = p.slug || ''; $('fDate').value = (p.date || '').slice(0, 10);
  $('fTags').value = Array.isArray(p.tags) ? p.tags.join(', ') : (p.tags || '');
  $('fSummary').value = p.summary || ''; $('fBody').value = p.body || '';
  $('fDraft').value = p.draft ? '1' : '0';
  $('pubHint').style.display = p.status === 'published' || (p.slug && !p.draft) ? 'block' : 'none';
  if (!$('pubHint').style.display || $('pubHint').style.display === 'block') {
    $('pubHint').innerHTML = p.slug && !p.draft
      ? '已发布：<a href="/posts/' + encodeURIComponent(p.slug) + '/" target="_blank">/posts/' + esc(p.slug) + '/</a>'
      : '';
  }
}
function collect() {
  return {
    title: $('fTitle').value.trim(), slug: $('fSlug').value.trim(), date: $('fDate').value,
    tags: $('fTags').value.split(',').map((s) => s.trim()).filter(Boolean),
    summary: $('fSummary').value.trim(), body: $('fBody').value,
    draft: $('fDraft').value === '1',
  };
}

/* ── 列表 ── */
function markMeta(t) { $('meta').textContent = t; }
function renderList() {
  const el = $('list'); el.innerHTML = '';
  $('listHint').style.display = LIST.length ? 'none' : 'block';
  LIST.forEach((p) => {
    const d = document.createElement('div');
    d.className = 'item' + (CURRENT && CURRENT.slug === p.slug ? ' on' : '');
    d.innerHTML = '<div class="t">' + esc(p.title || p.slug) + '</div>' +
      '<div class="m"><span>' + esc((p.date || '').slice(0, 10)) + '</span>' +
      '<span class="tag ' + (p.draft ? '' : 'pub') + '">' + (p.draft ? '草稿' : '已发布') + '</span></div>';
    d.onclick = () => { CURRENT = p; fill(p); renderList(); };
    el.appendChild(d);
  });
}
async function loadList() {
  try { const d = await api('/api/admin/blog/posts'); LIST = d.posts || d || []; renderList(); }
  catch (e) { toast('列表加载失败：' + e.message, true); }
}

/* ── 保存 / 发布 / 删除 ── */
async function save() {
  const p = collect();
  if (!p.title) return toast('标题不能空', true);
  if (!p.slug) p.slug = (p.title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-|-$/g, '') || 'post-' + Date.now());
  $('btnSave').disabled = true; markMeta('保存中…');
  try {
    const d = await api('/api/admin/blog/posts', { method: 'POST', body: JSON.stringify(p) });
    CURRENT = Object.assign(p, d.post || {});
    if (!CURRENT.slug) CURRENT.slug = p.slug;
    markMeta(p.draft ? '已存草稿 ' + new Date().toLocaleTimeString() : '已保存并发布 ' + new Date().toLocaleTimeString());
    toast(p.draft ? '已存为草稿' : '已保存并发布：/posts/' + CURRENT.slug + '/');
    await loadList(); fill(CURRENT); renderList();
  } catch (e) { markMeta('保存失败'); toast('保存失败：' + e.message, true); }
  finally { $('btnSave').disabled = false; }
}
async function del() {
  if (!CURRENT || !CURRENT.slug) return toast('这条还没落盘', true);
  if (!confirm('删除《' + (CURRENT.title || CURRENT.slug) + '》？')) return;
  try { await api('/api/admin/blog/posts/' + encodeURIComponent(CURRENT.slug), { method: 'DELETE' }); toast('已删除'); CURRENT = null; await loadList(); newPost(); }
  catch (e) { toast('删除失败：' + e.message, true); }
}

/* ── 事件绑定 ── */
$('btnLogin').onclick = login;
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('btnLogout').onclick = logout;
$('btnNew').onclick = newPost;
$('btnSave').onclick = save;
$('btnDel').onclick = del;
$('btnPreview').onclick = () => {
  const editing = $('editPane').style.display !== 'none';
  if (editing) { $('prevPane').innerHTML = md2html($('fBody').value); $('prevPane').style.display = ''; $('editPane').style.display = 'none'; $('btnPreview').textContent = '回到编辑'; }
  else { $('prevPane').style.display = 'none'; $('editPane').style.display = ''; $('btnPreview').textContent = '预览 / 编辑'; }
};
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

/* ── 启动：有 token 就直接进（token 失效会在首次请求时被踢回登录页）── */
(async function boot() {
  const saved = sessionStorage.getItem('admin_user');
  if (saved) { try { ME = JSON.parse(saved); } catch (e) {} }
  if (!TOKEN) return showLogin();
  // 现有后端用 GET /api/user/profile；identity 模块上线后会多一个 /api/auth/me，两者都试
  try { ME = await api('/api/user/profile'); sessionStorage.setItem('admin_user', JSON.stringify(ME)); await enter(); }
  catch (e) { logout(); }
})();
</script>
</body>
</html>
