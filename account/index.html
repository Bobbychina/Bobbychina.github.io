<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>账号 · bobbycn.cc</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/mac-block.js" defer></script>
<script src="/games/auth-config.js"></script>
<script src="/games/site-auth.js?v=20261008a"></script>
<script src="/games/site-saves.js?v=20261008a"></script>
<!--
  站点账号页（2026-10-08）
  这个页面回答一个问题：**我授权过哪些应用**，以及一句话把授权收回。
  数据来源是授权系统自己的端点（/api/auth/identity/oauth/grants 需要站点会话；
  逐个应用的状态来自 /games/site-auth.js 的本地登录态）。
  没有它的话，"可复用的授权系统"就缺了用户侧最重要的一环：能看见、能撤销。
-->
<style>
  :root{
    --serif:Georgia,"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --seal:#D4553F;
  }
  html[data-theme="dark"]{--bg:#121110;--ink:#EAE5DD;--dim:#948B80;--soft:#BDB4A8;--line:#2A2723;--panel:#191715;--glow1:#211D19}
  html[data-theme="light"]{--bg:#FAF7F0;--ink:#1E1B18;--dim:#8A8177;--soft:#4A443C;--line:#E7E1D6;--panel:#FFFDF8;--glow1:#FFFDF8}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.9;color:var(--ink);
    background:radial-gradient(120% 80% at 12% -10%,var(--glow1) 0%,rgba(0,0,0,0) 60%),var(--bg)}
  .wrap{max-width:680px;margin:9vh auto;padding:0 22px}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:14px;letter-spacing:.06em;color:var(--dim);font-weight:600;margin:0 0 10px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  code{font-family:Consolas,monospace;color:var(--seal)}
  .btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;background:transparent;
    color:var(--ink);border:1px solid var(--line);text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--seal);color:var(--seal)}
  .btn.danger{border-color:#7a3b33;color:#e08c80}
  .msg{font-size:13px;color:var(--dim);min-height:20px;margin-top:8px}
  .msg.err{color:var(--seal)}
  .top{position:absolute;top:18px;right:22px}
  .badge{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.g{border-color:#3f7a52;color:#6fce93}
</style>
</head>
<body>
<button class="btn top" id="btnTheme">☾ 深色</button>
<div class="wrap">
  <h1>账号</h1>
  <p class="sub">bobbycn.cc 的一个账号覆盖全站：游戏厅、博客、模拟炒股，以及以后自己做的独立游戏。下面是它的登录状态与授权记录。</p>

  <div class="card" id="idcard">
    <h2>站点身份</h2>
    <div id="identity">正在读取…</div>
  </div>

  <div class="card" id="appcard">
    <h2>已授权的应用</h2>
    <div id="apps">正在读取…</div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>云存档</h2>
    <div id="saves">正在读取…</div>
  </div>

  <div class="card">
    <h2>其它</h2>
    <a class="btn" href="/">回首页</a>
    <a class="btn" href="/games/">游戏厅</a>
    <a class="btn" href="/admin/">写作台</a>
    <button class="btn danger" id="btnOut">退出登录（全站）</button>
  </div>
</div>

<script>
(function(){
  var KEY='site-theme', saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  var theme=(saved==='light'||saved==='dark')?saved:'dark';
  function apply(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('btnTheme').textContent=t==='dark'?'☾ 深色':'☀ 浅色';}
  apply(theme);
  document.getElementById('btnTheme').addEventListener('click',function(){
    theme=theme==='dark'?'light':'dark'; try{localStorage.setItem(KEY,theme);}catch(e){}; apply(theme);
  });
})();

(function(){
  var T=function(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});};
  function el(id){return document.getElementById(id);}
  function msg(text,err){ el('msg').textContent=text||''; el('msg').className='msg'+(err?' err':''); }

  function renderIdentity(site){
    if(!site.signedIn){
      el('identity').innerHTML='未登录。<a class="btn" href="/login/">去登录</a>';
      return;
    }
    var u=site.user||{};
    el('identity').innerHTML='<div>已登录：<b>'+T(u.username||u.name||u.sub||'站点账号')+'</b> <span class="badge g">授权正常</span></div>'+
      (u.email?('<div style="color:var(--dim);font-size:13px">'+T(u.email)+'</div>'):'')+
      '<div style="color:var(--dim);font-size:13px">身份 ID：<code>'+T(u.sub||'')+'</code></div>';
  }

  /* 授权记录：站点会话给的权威列表（授权系统自己的端点） */
  function loadGrants(){
    return fetch('/api/auth/identity/oauth/grants',{credentials:'same-origin',cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .catch(function(){ return null; })
      .then(function(d){
        if(!d||!d.grants){ el('apps').innerHTML='<div class="hint" style="color:var(--dim)">读不到授权记录（未登录站点账号？）。</div>'; return; }
        if(!d.grants.length){ el('apps').innerHTML='<div style="color:var(--dim)">你还没授权过任何应用。到 <a href="/games/">游戏厅</a> 点一次登录就会出现在这里。</div>'; return; }
        var rows=d.grants.map(function(g){
          return '<tr><td><code>'+T(g.clientId)+'</code></td><td>'+T((g.scopes||[]).join(' '))+'</td><td>'+
            (g.revoked?'<span class="badge">已解除</span>':'<span class="badge g">有效</span>')+'</td><td>'+
            (g.revoked?'':'<button class="btn danger" data-client="'+T(g.clientId)+'">解除授权</button>')+'</td></tr>';
        }).join('');
        el('apps').innerHTML='<table><tr><th>应用</th><th>权限</th><th>状态</th><th></th></tr>'+rows+'</table>'+
          '<div style="color:var(--dim);font-size:12.5px;margin-top:8px">解除后：该应用的刷新令牌立刻作废，已发出的访问令牌最多再活 10 分钟。</div>';
        Array.prototype.forEach.call(el('apps').querySelectorAll('button[data-client]'),function(b){
          b.addEventListener('click',function(){ revoke(b.getAttribute('data-client')); });
        });
      });
  }

  function revoke(clientId){
    msg('正在解除 '+clientId+' …');
    fetch('/api/auth/identity/oauth/revoke-grant',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json'},body:JSON.stringify({client_id:clientId})})
      .then(function(r){ return r.json().then(function(d){return {ok:r.ok,d:d};}); })
      .then(function(res){
        if(!res.ok){ msg('解除失败：'+((res.d&&res.d.message)||'未知'),true); return; }
        msg('已解除 '+clientId+' 的授权');
        /* 本地令牌也要清掉，否则页面还以为登录着 */
        try{ if(window.SiteAuth&&window.SiteAuth.signOut) window.SiteAuth.signOut({clientId:clientId}); }catch(e){}
        loadGrants();
      })
      .catch(function(){ msg('网络错误',true); });
  }

  function loadSaves(){
    if(!window.SiteAuth){ el('saves').textContent='（未加载授权 SDK）'; return; }
    SiteAuth.ready().then(function(){
      if(!SiteAuth.status().signedIn){ el('saves').innerHTML='<div style="color:var(--dim)">授权登录后这里会显示各游戏的云存档规模。</div>'; return; }
      SiteAuth.authFetch('/api/auth/identity/saves/summary',{headers:{Accept:'application/json'}})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(d){
          if(!d){ el('saves').innerHTML='<div style="color:var(--dim)">读不到云存档（可能还没授权 saves 权限）。</div>'; return; }
          if(!d.games||!d.games.length){ el('saves').innerHTML='<div style="color:var(--dim)">还没有服务端存档。'+T(d.hint||'')+'</div>'; return; }
          var rows=d.games.map(function(g){
            return '<tr><td><code>'+T(g.game)+'</code></td><td>'+g.slots+' 个槽位</td><td>'+Math.round(g.bytes/1024)+' KB</td><td>'+T(String(g.lastUpdatedAt).slice(0,10))+'</td></tr>';
          }).join('');
          el('saves').innerHTML='<table><tr><th>游戏</th><th>槽位</th><th>大小</th><th>最近更新</th></tr>'+rows+'</table>'+
            '<div style="color:var(--dim);font-size:12.5px;margin-top:8px">'+T(d.hint||'')+'</div>';
        })
        .catch(function(){ el('saves').textContent='读不到云存档。'; });
    });
  }

  el('btnOut').addEventListener('click',function(){
    var go=function(){ location.href='/'; };
    if(window.SiteAuth) SiteAuth.signOut({global:true}).then(go,go); else go();
  });

  function boot(){
    if(!window.SiteAuth){ renderIdentity({signedIn:false}); loadGrants(); el('saves').textContent='（未加载授权 SDK）'; return; }
    SiteAuth.ready().then(function(){
      renderIdentity(SiteAuth.status());
      loadGrants();
      loadSaves();
    });
  }
  boot();
})();
</script>
</body>
</html>
