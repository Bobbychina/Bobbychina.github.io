<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="site.copy.d10cd4031106">账号 · bobbycn.cc</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/mac-block.js" defer></script>
<!-- i18n 引擎：解析期同步执行（勿加 defer/async）——与主页/游戏厅同一套词典 -->
<script src="/i18n/i18n.js?v=20261027chat1"></script>
<script src="/games/auth-config.js"></script>
<script src="/games/site-auth.js?v=20261021res1"></script>
<script src="/games/site-saves.js?v=20261021res1"></script>
<!--
  站点账号页（2026-10-08）
  这个页面回答一个问题：**我授权过哪些应用**，以及一句话把授权收回。
  数据来源是授权系统自己的端点（/api/auth/identity/oauth/grants 需要站点会话；
  云存档概览走 /api/auth/identity/saves/summary，用授权令牌）。
  没有它的话，"可复用的授权系统"就缺了用户侧最重要的一环：能看见、能撤销。
  2026-10-09：全部文案接入 i18n 词典（此前是硬编码中文），并挂上语言切换器。
-->
<style>
  :root{
    --serif:Georgia,"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --seal:#D4553F;
  }
  html[data-theme="dark"]{--bg:#121110;--ink:#EAE5DD;--dim:#948B80;--soft:#BDB4A8;--line:#2A2723;--panel:#191715;--glow1:#211D19}
  html[data-theme="light"]{--bg:#FAF7F0;--ink:#1E1B18;--dim:#8A8177;--soft:#4A443C;--line:#E7E1D6;--panel:#FFFDF8;--glow1:#FFFDF8}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.9;color:var(--ink);
    background:radial-gradient(120% 80% at 12% -10%,var(--glow1) 0%,rgba(0,0,0,0) 60%),var(--bg)}
  .wrap{max-width:680px;margin:9vh auto;padding:0 22px}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:14px;letter-spacing:.06em;color:var(--dim);font-weight:600;margin:0 0 10px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:12px}
  code{font-family:Consolas,monospace;color:var(--seal)}
  .btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;background:transparent;
    color:var(--ink);border:1px solid var(--line);text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--seal);color:var(--seal)}
  .btn.danger{border-color:#7a3b33;color:#e08c80}
  .msg{font-size:13px;color:var(--dim);min-height:20px;margin-top:8px}
  .msg.err{color:var(--seal)}
  .top{position:absolute;top:18px;right:22px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
  .top a{color:inherit;text-decoration:none}
  .badge{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.g{border-color:#3f7a52;color:#6fce93}
  .hintline{color:var(--dim);font-size:12.5px;margin-top:8px}
</style>
<link rel="stylesheet" href="/assets/atelier.css?v=20261021res1">
</head>
<body class="identity-edition account-edition">
<header class="top site-header">
  <div class="toprow"><a class="name" href="/" aria-label="Bobbychina 首页" data-i18n-attr="aria-label:site.copy.25097b84dd1d">Bobbychina<span class="brand-dot">.</span></a>
  <nav class="tabs" aria-label="主导航" data-i18n-attr="aria-label:site.copy.9bae68040509"><a href="/" data-i18n="nav.projects">作品</a><a href="/games/" data-i18n="nav.games">游戏厅</a><a href="/posts/" data-i18n="nav.posts">文章</a><a href="/resources/" data-i18n="nav.resources">资源</a><a href="/#about" data-i18n="nav.about">关于</a></nav>
  <div class="header-actions"><span data-i18n-switch></span><button class="iconbtn" id="btnTheme" type="button" aria-label="切换深浅色" title="切换深浅色" data-i18n-attr="aria-label:site.copy.9970c97a4fb5;title:site.copy.9970c97a4fb5"><span data-i18n="site.copy.e2ff2b4b22e4">☾ 深色</span></button></div></div>
 </header>
<div class="wrap">
  <h1 data-i18n="account.h1">账号</h1>
  <p class="sub" data-i18n="account.sub">bobbycn.cc 的一个账号覆盖全站：游戏厅、博客、模拟炒股，以及以后自己做的独立游戏。下面是它的登录状态与授权记录。</p>

  <div class="card" id="idcard">
    <h2 data-i18n="account.identity">站点身份</h2>
    <div id="identity"><span data-i18n="games.panel.savesLoading">正在读取…</span></div>
  </div>

  <div class="card" id="appcard">
    <h2 data-i18n="account.apps">已授权的应用</h2>
    <div id="apps"><span data-i18n="games.panel.savesLoading">正在读取…</span></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2 data-i18n="account.saves">云存档</h2>
    <div id="saves"><span data-i18n="games.panel.savesLoading">正在读取…</span></div>
  </div>

  <div class="card" id="chatcard" hidden>
    <h2 data-i18n="chat.entry.title">私线</h2>
    <p class="hintline" data-i18n="chat.entry.text">和 tina 的两人对话：发消息、传文件、贴链接。</p>
    <a class="btn" href="/chat/" data-i18n="chat.entry.cta">进入对话</a>
  </div>

  <div class="card">
    <h2 data-i18n="account.other">其它</h2>
    <a class="btn" href="/" data-i18n="account.back">回首页</a>
    <a class="btn" href="/games/" data-i18n="account.games">游戏厅</a>
    <a class="btn" href="/admin/" data-i18n="account.admin">写作台</a>
    <button class="btn danger" id="btnOut" data-i18n="account.logoutAll">退出登录（全站）</button>
  </div>
</div>

<script>
(function(){
  /* ---- 主题 ---- */
  var KEY='site-theme', saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  var theme=(saved==='light'||saved==='dark')?saved:'dark';
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    document.getElementById('btnTheme').textContent=t==='dark'?'☾':'☀';
    document.getElementById('btnTheme').title=t==='dark'?I18N.t('account.themeDark'):I18N.t('account.themeLight');
  }
  apply(theme);
  document.getElementById('btnTheme').addEventListener('click',function(){
    theme=theme==='dark'?'light':'dark'; try{localStorage.setItem(KEY,theme);}catch(e){}; apply(theme);
  });
  /* 语言切换后主题按钮的 title 也要跟着走 */
  if (window.I18N && I18N.onChange) I18N.onChange(function(){ apply(theme); });
})();

(function(){
  var T=function(k,v){ return window.I18N && I18N.t ? I18N.t(k,v) : k; };
  var esc=function(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});};
  function el(id){return document.getElementById(id);}
  function msg(text,err){ el('msg').textContent=text||''; el('msg').className='msg'+(err?' err':''); }

  function renderIdentity(site){
    if(!site.signedIn){
      el('identity').innerHTML=T('account.notSignedIn')+' <a class="btn" href="/login/">'+esc(T('account.goLogin'))+'</a>';
      return;
    }
    var u=site.user||{};
    el('identity').innerHTML='<div>'+T('account.signedInAs',{name:esc(u.username||u.name||u.sub||T('account.siteAccount'))})+
      ' <span class="badge g">'+esc(T('account.grantOk'))+'</span></div>'+
      (u.email?('<div class="hintline">'+esc(u.email)+'</div>'):'')+
      '<div class="hintline">'+esc(T('account.identityId'))+'<code>'+esc(u.sub||'')+'</code></div>';
  }

  /* 授权记录：站点会话给的权威列表（授权系统自己的端点） */
  function loadGrants(){
    return fetch('/api/auth/identity/oauth/grants',{credentials:'same-origin',cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .catch(function(){ return null; })
      .then(function(d){
        if(!d||!d.grants){ el('apps').innerHTML='<div class="hintline">'+esc(T('account.grantsUnreadable'))+'</div>'; return; }
        if(!d.grants.length){
          el('apps').innerHTML='<div class="hintline">'+T('account.grantsEmpty',{games:'<a href="/games/">'+esc(T('account.games'))+'</a>'})+'</div>';
          return;
        }
        var rows=d.grants.map(function(g){
          return '<tr><td><code>'+esc(g.clientId)+'</code></td><td>'+esc((g.scopes||[]).join(' '))+'</td><td>'+
            (g.revoked?'<span class="badge">'+esc(T('account.stateRevoked'))+'</span>':'<span class="badge g">'+esc(T('account.stateActive'))+'</span>')+'</td><td>'+
            (g.revoked?'':'<button class="btn danger" data-client="'+esc(g.clientId)+'">'+esc(T('account.revoke'))+'</button>')+'</td></tr>';
        }).join('');
        el('apps').innerHTML='<table><tr><th>'+esc(T('account.thApp'))+'</th><th>'+esc(T('account.thScopes'))+'</th><th>'+esc(T('account.thState'))+'</th><th></th></tr>'+rows+'</table>'+
          '<div class="hintline">'+esc(T('account.revokeNote'))+'</div>';
        Array.prototype.forEach.call(el('apps').querySelectorAll('button[data-client]'),function(b){
          b.addEventListener('click',function(){ revoke(b.getAttribute('data-client')); });
        });
      });
  }

  function revoke(clientId){
    msg(T('account.revoking',{client:clientId}));
    fetch('/api/auth/identity/oauth/revoke-grant',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json'},body:JSON.stringify({client_id:clientId})})
      .then(function(r){ return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d};}); })
      .then(function(res){
        if(!res.ok){ msg(T('account.revokeFailed',{err:I18N.error(res.d, res.status || 400)}),true); return; }
        msg(T('account.revoked',{client:clientId}));
        /* 本地令牌也要清掉，否则页面还以为登录着 */
        try{ if(window.SiteAuth&&window.SiteAuth.signOut) window.SiteAuth.signOut({clientId:clientId}); }catch(e){}
        loadGrants();
      })
      .catch(function(){ msg(T('account.netErr'),true); });
  }

  function loadSaves(){
    if(!window.SiteAuth){ el('saves').textContent=T('account.noSdk'); return; }
    SiteAuth.ready().then(function(){
      if(!SiteAuth.status().signedIn){ el('saves').innerHTML='<div class="hintline">'+esc(T('account.savesAfterLogin'))+'</div>'; return; }
      SiteAuth.authFetch('/api/auth/identity/saves/summary',{headers:{Accept:'application/json'}})
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(d){
          if(!d){ el('saves').innerHTML='<div class="hintline">'+esc(T('account.savesUnreadable'))+'</div>'; return; }
          if(!d.games||!d.games.length){ el('saves').innerHTML='<div class="hintline">'+esc(T('account.savesEmpty'))+esc(d.hint?T('account.saveHint'):'')+'</div>'; return; }
          var rows=d.games.map(function(g){
            return '<tr><td><code>'+esc(g.game)+'</code></td><td>'+esc(T('account.slots',{n:I18N.number(g.slots)}))+'</td><td>'+I18N.number(Math.round(g.bytes/1024))+' KB</td><td>'+esc(I18N.date(g.lastUpdatedAt,{dateStyle:'medium'}))+'</td></tr>';
          }).join('');
          el('saves').innerHTML='<table><tr><th>'+esc(T('account.thGame'))+'</th><th>'+esc(T('account.thSlots'))+'</th><th>'+esc(T('account.thSize'))+'</th><th>'+esc(T('account.thUpdated'))+'</th></tr>'+rows+'</table>'+
            '<div class="hintline">'+esc(d.hint?T('account.saveHint'):'')+'</div>';
        })
        .catch(function(){ el('saves').textContent=T('account.savesUnreadable'); });
    });
  }

  el('btnOut').addEventListener('click',function(){
    var go=function(){ location.href='/'; };
    if(window.SiteAuth) SiteAuth.signOut({global:true}).then(go,go); else go();
  });

  /* 语言切换后重画（静态文案由 i18n 引擎负责，这里是运行时拼的那几块） */
  if (window.I18N && I18N.onChange) I18N.onChange(function(){ boot(false); });

  var booted=false;
  function boot(first){
    if(!window.SiteAuth){ renderIdentity({signedIn:false}); loadGrants(); el('saves').textContent=T('account.noSdk'); return; }
    SiteAuth.ready().then(function(){
      renderIdentity(SiteAuth.status());
      loadGrants();
      loadSaves();
      loadChatEntry();
    });
  }

  /* 私线入口：只有站主与受邀账号（role=subadmin）能看到这张卡；能不能聊由服务端裁决 */
  function loadChatEntry(){
    fetch('/api/chat/access',{credentials:'same-origin',cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d && d.allowed) el('chatcard').hidden=false; })
      .catch(function(){ /* 没有私线权限就是看不到，不需要提示 */ });
  }
  boot(true);
})();
</script>
</body>
</html>
