<style>
  .card{max-width:520px;margin:12vh auto;padding:0 22px;text-align:left}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 10px}

  .foot a{color:inherit;border-bottom:1px solid transparent}
  .foot a:hover{color:var(--seal);border-bottom-color:var(--seal)}
</style>

</head>
<body class="identity-edition">
<header class="top site-header"><span data-i18n-switch></span>
  <div class="toprow"><a class="name" href="/" aria-label="Bobbychina 首页" data-i18n-attr="aria-label:site.copy.25097b84dd1d">Bobbychina<span class="brand-dot">.</span></a>
  <nav class="tabs" aria-label="主导航" data-i18n-attr="aria-label:site.copy.9bae68040509"><a href="/" data-i18n="nav.projects">作品</a><a href="/games/" data-i18n="nav.games">游戏厅</a><a href="/posts/" data-i18n="nav.posts">文章</a><a href="/resources/" data-i18n="nav.resources">资源</a><a href="/#about" data-i18n="nav.about">关于</a></nav>
  <div class="header-actions"><button class="iconbtn" id="btnTheme" type="button" aria-label="切换深浅色" title="切换深浅色" data-i18n-attr="aria-label:site.copy.9970c97a4fb5;title:site.copy.9970c97a4fb5"><span data-i18n="site.copy.e2ff2b4b22e4">☾ 深色</span></button></div></div>
 </header>
<main class="identity-layout">
<div class="card">
  <h1 id="h"><span data-i18n="site.copy.c725500abce1">正在验证…</span></h1>
  <p class="msg" id="msg"><span data-i18n="site.copy.043bd055d879">请稍候。</span></p>
  <div class="foot"><a href="/"><span data-i18n="account.back">回首页</span></a><a href="/login/"><span data-i18n="account.goLogin">去登录</span></a><a href="/posts/"><span data-i18n="site.copy.33c0d1c504d7">看看博客</span></a></div>
</div>
</main>

<script>
/* 邮件里的链接形如 https://bobbycn.cc/verify-email?token=xxx（见 identity.service.ts）。
   这一页负责把 token POST 给 /api/auth/identity/verify —— 验证成功时后端会下发域级 Cookie，
   所以用户点完链接就已经是登录状态，直接送他回家。 */
(function(){
  var h=document.getElementById('h'), msg=document.getElementById('msg');
  var token=new URLSearchParams(location.search).get('token');
  function fail(t){ I18N.bind(h, "textContent", function(){return I18N.t("site.copy.86b82d251878");}); msg.className='msg err'; msg.textContent=t; }
  if(!token){ fail(I18N.t("site.copy.8081b49c626d")); return; }
  fetch('/api/auth/identity/verify',{method:'POST',credentials:'same-origin',
    headers:{'content-type':'application/json','Accept-Language':I18N.current()},body:JSON.stringify({token:token})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,status:r.status,d:d}; }); })
    .then(function(res){
      if(!res.ok){ fail(I18N.error(res.d,res.status)||(I18N.t("site.copy.267b29f79c49")+res.status+'）')); return; }
      I18N.bind(h, "textContent", function(){return I18N.t("site.copy.763166908683");});
      I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.47788835c5d9");});
      setTimeout(function(){ location.href='/'; },2000);
    })
    .catch(function(){ fail(I18N.t("site.copy.3fcf5895c36f")); });
})();
</script>
</body>
