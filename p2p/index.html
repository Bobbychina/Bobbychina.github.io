<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="p2p.title">P2P 文件互传</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css?v=20261021res1">
  <link rel="stylesheet" href="./p2p.css">
  <script src="/i18n/i18n.js?v=20261123p2p1"></script>
  <script defer src="/assets/site.js?v=20261021res1"></script>
  <script defer src="/games/alan/online/vendor/peerjs.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="wordmark" href="/">Bobbychina<span>.</span></a>
      <div class="preferences"><span data-i18n-switch></span><button class="iconbtn" id="btnTheme" type="button" data-i18n-attr="aria-label:site.copy.9970c97a4fb5">☾</button></div>
    </header>
    <main>
      <a class="back" href="/resources/"><span aria-hidden="true">←</span> <span data-i18n="p2p.context">返回共享资源</span></a>
      <h1 data-i18n="p2p.title">P2P 文件互传</h1>
      <p class="lead" data-i18n="p2p.intro">两人用同一个房间码连接。把文件拖进房间，对方就能选择下载。</p>
      <div id="lobby" class="room-panel">
        <button id="create" class="btn primary" type="button" data-i18n="p2p.create">创建房间</button>
        <form id="join-form">
          <label for="join-code" data-i18n="p2p.joinHint">已有房间码？在这里输入。</label>
          <div class="join-row"><input id="join-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" placeholder="XXXX-XXXX-XXXX-XXXX"><button id="join" class="btn" type="submit" data-i18n="p2p.join">加入房间</button></div>
        </form>
      </div>
      <section id="active-room" class="room-panel" hidden aria-labelledby="room-label">
        <div class="room-details">
          <h2 id="room-label" data-i18n="p2p.room">房间码</h2>
          <strong id="room-code" dir="ltr"></strong>
          <p class="hint" data-i18n="p2p.shareHint">把房间码私下发给对方，传完前请保持页面打开。</p>
        </div>
        <div class="room-buttons"><button id="copy" class="btn" type="button" data-i18n="p2p.copy">复制房间码</button><button id="leave" class="btn ghost" type="button" data-i18n="p2p.leave">离开房间</button></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="notice" role="alert"></p>
      <div id="files" hidden>
        <div class="columns">
          <section aria-labelledby="local-label">
            <h2 id="local-label" data-i18n="p2p.local">我分享的文件</h2>
            <div id="dropzone">
              <p data-i18n="p2p.drop">拖放文件到这里</p>
              <button class="btn" id="choose" type="button" data-i18n="p2p.choose">选择文件</button>
              <input id="picker" type="file" multiple hidden>
            </div>
            <ul id="local-list"></ul>
            <p class="hint" data-i18n="p2p.limit">每人最多分享 32 个文件。</p>
          </section>
          <section aria-labelledby="remote-label">
            <h2 id="remote-label" data-i18n="p2p.remote">对方分享的文件</h2>
            <p class="empty" id="remote-empty" data-i18n="p2p.remoteEmpty">对方分享文件后，会出现在这里。</p>
            <ul id="remote-list"></ul>
            <p class="hint" id="memory-limit" hidden data-i18n="p2p.memoryLimit">当前浏览器每次可接收不超过 128 MiB 的文件。</p>
          </section>
        </div>
      </div>
    </main>
    <footer><p data-i18n="p2p.network">文件通过 WebRTC 在两台设备之间直传。PeerJS 和 STUN 服务帮助建立连接。网络阻止直连时，请换个网络重试。</p></footer>
  </div>
</body>
</html>
