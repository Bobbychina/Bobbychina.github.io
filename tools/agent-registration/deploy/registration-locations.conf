location = /agent/auth { include /etc/nginx/snippets/agent-registration-proxy.conf; }
location = /agent/auth/claim { include /etc/nginx/snippets/agent-registration-proxy.conf; }
location = /agent/auth/revoke { include /etc/nginx/snippets/agent-registration-proxy.conf; }
location = /agent/claim { include /etc/nginx/snippets/agent-registration-proxy.conf; }
location = /agent/claim/revoke { include /etc/nginx/snippets/agent-registration-proxy.conf; }
location = /agent/directory { include /etc/nginx/snippets/agent-registration-proxy.conf; }

location = /.well-known/oauth-protected-resource/agent/directory {
    include /etc/nginx/snippets/agent-readiness-metadata.conf;
    default_type application/json;
    try_files /.well-known/agent-directory-resource.json =404;
}
