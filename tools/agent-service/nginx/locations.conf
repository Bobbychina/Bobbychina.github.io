location = /_agent/content {
    internal;
    proxy_pass http://127.0.0.1:18746;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host bobbycn.cc;
    proxy_set_header Connection "";
    proxy_set_header Accept $http_accept;
    proxy_set_header X-Agent-Page $agent_page_path;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header Link $agent_links;
}

location = /mcp { include /etc/nginx/snippets/agent-readiness-rpc.conf; }
location = /a2a { include /etc/nginx/snippets/agent-readiness-rpc.conf; }
location = /mcp/server-card { include /etc/nginx/snippets/agent-readiness-rpc.conf; }
