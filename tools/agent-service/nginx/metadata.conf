if ($block_mac) { return 403; }
if ($request_method = OPTIONS) { return 204; }
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
types { }
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Accept, Content-Type, If-None-Match" always;
add_header Cache-Control "no-cache" always;
add_header Cloudflare-CDN-Cache-Control "no-store" always;
