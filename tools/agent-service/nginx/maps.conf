# Use the original path so index rewrites and the internal Markdown route cannot change it.
map $request_uri $agent_page_path {
    default "";
    "~^(?<agent_public_path>/(?:(?:games|resources|sponsor)/|posts/(?:[A-Za-z0-9][A-Za-z0-9-]{0,119}/)?)?(?:index[.]html)?)(?:[?].*)?$" $agent_public_path;
}
map "$request_method:$agent_page_path" $agent_public_get {
    default 0;
    "~^(GET|HEAD):/" 1;
}
# The converter decides quality, preference and q=0 using a media type parser.
map $http_accept $agent_mentions_markdown {
    default 0;
    "~*(^|,)[[:space:]]*text/markdown[[:space:]]*([;,]|$)" 1;
}
map "$agent_public_get:$agent_mentions_markdown" $agent_negotiate {
    default 0;
    1:1 1;
}
map $agent_public_get $agent_vary {
    default "";
    1 Accept;
}
map $agent_public_get $agent_content_signal {
    default "";
    1 "search=yes, ai-input=yes, ai-train=no";
}
map $agent_public_get $agent_links {
    default "";
    1 '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="service-doc", </.well-known/ard.json>; rel="ard"; type="application/ard+json", </.well-known/agent-skills/index.json>; rel="describedby"';
}
