<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<script src="/i18n/i18n.js?v=20261021res1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="site.copy.bc61215d1656">重设口令 · bobbycn.cc</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css?v=20261021res1">
<script src="/assets/site.js?v=20261021res1" defer></script>
<style>
  .card{max-width:420px;margin:11vh auto;padding:0 22px}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  /* 加 .card 前缀的原因同 register：否则页头共用的 .iconbtn 会被 width:100% 拉变形 */
  .card label{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em;margin:14px 0 5px}
  .card input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .card input:focus{outline:none;border-color:var(--seal)}
  .card button{font:inherit;font-size:14px;width:100%;margin-top:20px;padding:10px;border-radius:9px;cursor:pointer;
         background:transparent;color:var(--ink);border:1px solid var(--seal)}
  .card button:hover{background:var(--seal);color:#1A0F0C}
  .card button[disabled]{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;color:var(--seal);min-height:20px;line-height:1.8}
  .foot{margin-top:22px;color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
  .foot a{color:inherit;border-bottom:1px solid transparent}
  .foot a:hover{color:var(--seal);border-bottom-color:var(--seal)}
</style>
<link rel="stylesheet" href="/assets/atelier.css?v=20261021res1">
</head>
<body class="identity-edition">
<header class="top site-header"><span data-i18n-switch></span>
  <div class="toprow"><a class="name" href="/" aria-label="Bobbychina 首页" data-i18n-attr="aria-label:site.copy.25097b84dd1d">Bobbychina<span class="brand-dot">.</span></a>
  <nav class="tabs" aria-label="主导航" data-i18n-attr="aria-label:site.copy.9bae68040509"><a href="/" data-i18n="nav.projects">作品</a><a href="/games/" data-i18n="nav.games">游戏厅</a><a href="/posts/" data-i18n="nav.posts">文章</a><a href="/resources/" data-i18n="nav.resources">资源</a><a href="/#about" data-i18n="nav.about">关于</a></nav>
  <div class="header-actions"><button class="iconbtn" id="btnTheme" type="button" aria-label="切换深浅色" title="切换深浅色" data-i18n-attr="aria-label:site.copy.9970c97a4fb5;title:site.copy.9970c97a4fb5"><span data-i18n="site.copy.e2ff2b4b22e4">☾ 深色</span></button></div></div>
 </header>
<main class="identity-layout">
<div class="card">
  <h1><span data-i18n="site.copy.c1464961b95d">设置新口令</span></h1>
  <p class="sub"><span data-i18n="site.copy.e632acb5f94d">重置完成后，该账号其它地方的登录会全部失效。</span></p>

  <label for="pw"><span data-i18n="site.copy.cdac62838bf6">新口令（至少 8 位）</span></label>
  <input id="pw" type="password" autocomplete="new-password">
  <label for="pw2"><span data-i18n="site.copy.22ac4b36256b">再输一次</span></label>
  <input id="pw2" type="password" autocomplete="new-password">

  <button id="btn"><span data-i18n="site.copy.37fe22a0225a">保存并去登录</span></button>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/login/"><span data-i18n="site.copy.c639f9bac538">← 回登录</span></a><a href="/"><span data-i18n="account.back">回首页</span></a></div>
</div>
</main>

<script>
/* 邮件里的链接形如 https://bobbycn.cc/reset-password?token=xxx（见 identity.service.ts）。
   成功后后端会撤销该账号的全部会话，所以这里要求重新登录。 */
(function(){
  var msg=document.getElementById('msg'), btn=document.getElementById('btn');
  var token=new URLSearchParams(location.search).get('token');
  if(!token){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.e52fc7ed86d9");}); btn.disabled=true; return; }
  function go(){
    var pw=document.getElementById('pw').value, pw2=document.getElementById('pw2').value;
    if(pw.length<8){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.1398c82e9ba3");}); return; }
    if(pw!==pw2){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.24f23df7ea2f");}); return; }
    btn.disabled=true; I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.18931020ad52");});
    fetch('/api/auth/identity/password/reset',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json','Accept-Language':I18N.current()},body:JSON.stringify({token:token,password:pw})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,status:r.status,d:d}; }); })
      .then(function(res){
        if(res.ok){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.82d87286a5ef");}); setTimeout(function(){ location.href='/login/'; },1500); return; }
        I18N.bind(msg, "textContent", function(){return I18N.error(res.d,res.status)||(I18N.t("site.copy.e14cb35b540c")+res.status+'）');}); btn.disabled=false;
      })
      .catch(function(){ I18N.bind(msg, "textContent", function(){return I18N.t("site.copy.a47e6b8881b7");}); btn.disabled=false; });
  }
  btn.addEventListener('click',go);
  document.getElementById('pw2').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
})();
</script>
</body>
</html>
